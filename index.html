<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C7547">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fantasy ก๊วน 7 คน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#F2F5EF; --surface:#FFFFFF; --sunk:#E8EDE4; --ink:#15211A; --muted:#5B6A61; --line:#D8E0D4;
  --turf:#1C7547; --turf-ink:#FFFFFF; --turf-soft:#DCEEDF;
  --att:#D4512A; --att-soft:#FBE3DA; --def:#2A58C4; --def-soft:#DDE6FA;
  --warn:#A86A12; --warn-soft:#F8EBD2; --bad:#B8322A; --bad-soft:#F7DEDB; --good:#1C7547;
  --shadow:0 1px 2px rgba(20,40,28,.06),0 4px 14px rgba(20,40,28,.05);
  --display:"Chakra Petch","Anuphan",system-ui,sans-serif;
  --body:"Anuphan","Noto Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1411; --surface:#161F1A; --sunk:#1D2822; --ink:#E5EDE7; --muted:#95A59B; --line:#2A3730;
    --turf:#3DB27A; --turf-ink:#06140C; --turf-soft:#173726;
    --att:#F07B55; --att-soft:#3A2119; --def:#7196F2; --def-soft:#1A2640;
    --warn:#E0A445; --warn-soft:#352812; --bad:#F0736A; --bad-soft:#3A1B19; --good:#3DB27A;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1411; --surface:#161F1A; --sunk:#1D2822; --ink:#E5EDE7; --muted:#95A59B; --line:#2A3730;
  --turf:#3DB27A; --turf-ink:#06140C; --turf-soft:#173726;
  --att:#F07B55; --att-soft:#3A2119; --def:#7196F2; --def-soft:#1A2640;
  --warn:#E0A445; --warn-soft:#352812; --bad:#F0736A; --bad-soft:#3A1B19; --good:#3DB27A;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:760px;margin:0 auto}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
.num,.tn{font-variant-numeric:tabular-nums}
.num{font-family:var(--display);font-weight:600}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:12px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{flex:none}
.logo h1{font-size:20px;letter-spacing:.02em}
.logo small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}
.me{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.me select{max-width:150px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--turf)}

main{padding-top:18px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);display:grid;gap:12px;min-width:0}
.card h2{font-size:17px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--display)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.wrapx{flex-wrap:wrap}
.grow{flex:1;min-width:0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:38px}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--turf);border-color:var(--turf);color:var(--turf-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--turf);outline-offset:2px}
select,input[type=text],input[type=number],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px;max-width:100%}
textarea{width:100%;font:inherit;color:inherit;min-height:70px}

.pos{display:inline-block;font-size:11px;font-weight:700;font-family:var(--display);letter-spacing:.06em;padding:1px 6px;border-radius:4px;flex:none}
.pos.ATT{background:var(--att-soft);color:var(--att)}
.pos.DEF{background:var(--def-soft);color:var(--def)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--turf-soft);color:var(--good)}
.pill.wait{background:var(--sunk);color:var(--muted)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px 5px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:500;min-height:34px}
.chip[aria-pressed="true"]{background:var(--turf-soft);border-color:var(--turf);color:var(--ink)}
.chip[aria-pressed="true"]::after{content:"✓";color:var(--good);font-weight:700}

/* tables/lists */
.list{display:grid}
.li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .rk{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center}
.li.top1 .rk{color:var(--turf)}
.li .nm{font-weight:600;overflow-wrap:anywhere}
.li .sub{font-size:12.5px;color:var(--muted)}
.li .val{text-align:right}
.big{font-family:var(--display);font-size:22px;font-weight:700;line-height:1}
.clickable{cursor:pointer}
.clickable:hover .nm{text-decoration:underline;text-underline-offset:3px}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}

/* teams */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.team{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.team-h{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--sunk);font-weight:700}
.bib{width:14px;height:18px;border-radius:3px 3px 5px 5px;border:1px solid rgba(128,128,128,.5);flex:none}
.team-b{padding:6px 12px 12px;display:grid;gap:2px}
.tp{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.tp .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp select{min-height:28px;padding:2px 4px;font-size:12px;max-width:92px}
.loan{color:var(--muted);font-style:italic}
.av{width:28px;height:28px;border-radius:50%;flex:none;object-fit:cover;display:inline-grid;place-items:center;font-family:var(--display);font-weight:700;font-size:12px;color:#fff;vertical-align:middle;background:var(--sunk)}
.av.s{width:22px;height:22px;font-size:10px}.av.l{width:72px;height:72px;font-size:26px}.av.m{width:44px;height:44px;font-size:16px}
.nmrow{display:flex;align-items:center;gap:8px;min-width:0}
.photo-pick{display:flex;align-items:center;gap:14px}
.team-h .btn{padding:2px 8px;min-height:26px;font-size:12px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{position:relative;width:34px;height:34px;border-radius:8px;border:2px solid var(--line);cursor:pointer}
.sw[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.pool{border:1.5px dashed var(--line);border-radius:10px;padding:10px;display:grid;gap:6px}
.pool-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pool-row .who{display:flex;align-items:center;gap:6px;min-width:120px;flex:1}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;cursor:pointer;min-height:32px}
.tbtn:hover{background:var(--sunk)}

/* fixtures */
.fx{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.fx:first-child{border-top:0}
.fx .tA{display:flex;align-items:center;gap:6px;justify-content:flex-end;text-align:right;font-weight:600}
.fx .tB{display:flex;align-items:center;gap:6px;font-weight:600}
.fx .sc{font-family:var(--display);font-size:22px;font-weight:700;min-width:74px;text-align:center}
.fx .sc.pending{font-size:14px;color:var(--muted);font-weight:500}
.fx-meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.fx-ev{grid-column:1/-1;font-size:12.5px;color:var(--muted);text-align:center}
.why{grid-column:1/-1;font-size:13px;background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:6px 10px}

/* picker */
.budget{display:grid;gap:6px}
.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--turf);border-radius:99px;transition:width .2s}
.bar.over i{background:var(--bad)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1.5px dashed var(--line);border-radius:10px;padding:10px;min-height:86px;display:grid;align-content:space-between;gap:4px;text-align:center}
.slot.f{border-style:solid;border-color:var(--turf);background:var(--turf-soft)}
.slot .n{font-weight:700;overflow-wrap:anywhere}
.cap{border:1px solid var(--line);background:var(--surface);border-radius:99px;font-size:12px;font-weight:700;padding:2px 8px;cursor:pointer}
.cap[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pk{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;border:1px solid transparent;cursor:pointer;text-align:left;background:none;width:100%}
.pk:hover{background:var(--sunk)}
.pk[aria-pressed="true"]{border-color:var(--turf);background:var(--turf-soft)}
.pk .price{font-family:var(--display);font-weight:700;font-size:17px;min-width:34px;text-align:right}
.trend{font-size:11px;font-weight:700}
.trend.up{color:var(--good)} .trend.dn{color:var(--bad)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,14,10,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.scrim{align-items:center}}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px;display:grid;gap:14px;border:1px solid var(--line)}
.modal h3{font-size:18px}
.field{display:grid;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 16px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--sunk);border-radius:12px;padding:14px}
.board .t{display:grid;gap:8px;justify-items:center;text-align:center;font-weight:700}
.board .s{font-family:var(--display);font-size:44px;font-weight:700;line-height:1}
.ev{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.stepbox{border:1.5px solid var(--turf);border-radius:10px;padding:12px;display:grid;gap:10px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.stat{background:var(--sunk);border-radius:8px;padding:10px;display:grid;gap:2px}
.stat b{font-family:var(--display);font-size:20px}
.stat span{font-size:12px;color:var(--muted)}

.empty{text-align:center;padding:20px 8px;color:var(--muted);display:grid;gap:10px;justify-items:center}
.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-weight:600;font-size:14px;max-width:calc(100vw - 32px)}
.toast.err{background:var(--bad);color:#fff}
.cfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.cfg input{width:100%}
.pitch-line{height:2px;background:repeating-linear-gradient(90deg,var(--turf) 0 10px,transparent 10px 16px);opacity:.5;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">
        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="8" fill="var(--turf)"/><rect x="6" y="7" width="22" height="20" rx="2" fill="none" stroke="var(--turf-ink)" stroke-width="1.6"/><line x1="17" y1="7" x2="17" y2="27" stroke="var(--turf-ink)" stroke-width="1.6"/><circle cx="17" cy="17" r="3.6" fill="none" stroke="var(--turf-ink)" stroke-width="1.6"/></svg>
        <div><h1>7s FANTASY</h1><small>ลีกก๊วนบอล 7 คน</small></div>
      </div>
      <div class="me"><label for="meSel">ฉันคือ</label><select id="meSel" data-change="me"></select></div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* ---------- config & constants ---------- */
const DEF_CFG={goalATT:3,goalDEF:5,assist:2,ownGoal:-2,win:1,csATT:1,defStart:3,defPerConceded:1,csDEF:2,
  budget:30,squad:3,maxPerTeam:2,captain:2,priceNew:7,priceBase:5,priceSlope:0.5,priceMin:4,priceMax:15,formWeeks:4};
const CFG_LABELS=[
 ['goalATT','ประตู (ตัวบุก)'],['goalDEF','ประตู (ตัวรับ)'],['assist','แอสซิสต์'],['ownGoal','ทำเข้าประตูตัวเอง'],
 ['win','ทีมชนะ (ต่อแมตช์)'],['csATT','คลีนชีต (ตัวบุก)'],['defStart','แต้มตั้งต้นตัวรับ/แมตช์'],['defPerConceded','ตัวรับเสียแต้ม/ประตูที่โดน'],
 ['csDEF','โบนัสคลีนชีต (ตัวรับ)'],['budget','งบต่อสัปดาห์'],['squad','จำนวนนักเตะที่เลือก'],['maxPerTeam','เลือกจากทีมเดียวกันได้ไม่เกิน'],['captain','ตัวคูณกัปตัน'],
 ['priceNew','ราคานักเตะใหม่'],['priceBase','ราคาฐาน'],['priceSlope','ราคาเพิ่ม/แต้มฟอร์ม'],['priceMin','ราคาต่ำสุด'],['priceMax','ราคาสูงสุด'],['formWeeks','ฟอร์มคิดจากกี่สัปดาห์ล่าสุด']];
const BIBS=[{n:'ส้ม',c:'#EE7A2E'},{n:'น้ำเงิน',c:'#2F5BD3'},{n:'ขาว',c:'#F4F4F0'},{n:'ดำ',c:'#26292A'},{n:'เหลือง',c:'#EBC11B'}];
const POS_TH={ATT:'บุก',DEF:'รับ'};
const TABS=[['home','ตาราง'],['week','แมตช์'],['team','ทีม Fantasy'],['players','นักเตะ'],['rules','กติกา']];
const COLS=['players','weeks','matches','picks','config'];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=p=>p+Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o??null));
const fmt=n=>{n=+n||0;return Number.isInteger(n)?String(n):n.toFixed(1)};
const sgn=n=>(n>0?'+':'')+fmt(n);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function todayISO(off=0){const d=new Date(Date.now()+7*3600e3+off*864e5);return d.toISOString().slice(0,10)}
function thDate(iso,long){try{return new Date(iso+'T00:00:00').toLocaleDateString('th-TH',long?{weekday:'long',day:'numeric',month:'long',year:'numeric'}:{weekday:'short',day:'numeric',month:'short'})}catch{return iso}}
function lsGet(k){try{return localStorage.getItem(k)}catch{return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}}
function deepMerge(t,s){for(const k in s){if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])&&t[k]&&typeof t[k]==='object'&&!Array.isArray(t[k]))deepMerge(t[k],s[k]);else t[k]=s[k]}return t}

/* ---------- state & store ---------- */
const S={players:{},weeks:{},matches:{},picks:{},config:{...DEF_CFG},me:lsGet('f7_me'),tab:'home',weekId:null,teamWeekId:null,draft:{},loaded:false};
let API=false,ver=0,srvVer=-1;const RAW={players:{},weeks:{},matches:{},picks:{},config:{}};
function ingest(col,map){
  const out={};for(const [k,v] of Object.entries(map))out[k]={...v,id:k};
  if(col==='config')S.config={...DEF_CFG,...(map.scoring||{})};else S[col]=out;
  ver++;schedule();
}
const strip=d=>{const {id,...r}=d;return r};
function applyLocal(op,col,id,data){
  if(op==='set')RAW[col][id]=clone(data);
  else if(op==='merge'){if(!RAW[col][id])throw{code:'not_found'};deepMerge(RAW[col][id],clone(data))}
  else delete RAW[col][id];
  ingest(col,clone(RAW[col]));
}
async function send(op,col,id,data){
  if(op==='set')data=strip(clone(data));
  applyLocal(op,col,id,data);
  if(!API)return;
  const r=await fetch('/api/data',{method:'POST',headers:{'content-type':'application/json','x-pin':lsGet('f7_pin')||''},body:JSON.stringify({op,col,id,data})});
  if(r.status===401){lsSet('f7_pin',null);askPin();throw{code:'ต้องใส่รหัสก๊วน'}}
  if(!r.ok){refresh(true);throw{code:(await r.json().catch(()=>({}))).error||r.status}}
}
const store={
  set:(col,id,data)=>send('set',col,id,data),
  merge:(col,id,data)=>send('merge',col,id,data),
  del:(col,id)=>send('del',col,id)
};
let busy=false;
async function refresh(force){
  if(busy&&!force)return;busy=true;
  try{
    const r=await fetch('/api/data'+(force||srvVer<0?'':'?since='+srvVer),{cache:'no-store'});
    const j=await r.json();
    if(!r.ok)throw j;
    API=true;
    if(!j.same){srvVer=j.ver;for(const c of COLS){RAW[c]=j.data[c]||{};ingest(c,clone(RAW[c]))}}
    if(!S.loaded){S.loaded=true;render()}
    setBanner('');
  }catch(e){

/* ---------- scoring engine ---------- */
const blank=()=>({pts:0,g:0,a:0,cs:0,mp:0,w:0,con:0,og:0});
function addStat(t,s){for(const k in s)t[k]=(t[k]||0)+s[k]}
const isDisputed=m=>Object.values(m.votes||{}).some(x=>x&&x.v===-1);
const counts=m=>m.played&&!isDisputed(m);
function score(m){let a=0,b=0;for(const e of m.events||[]){if(e.side==='a')a++;else b++}return [a,b]}
function matchPoints(m,w,cfg){
  const res={};const [sa,sb]=score(m);
  for(const [ti,gf,ga] of [[m.a,sa,sb],[m.b,sb,sa]]){
    const team=w.teams?.[ti];if(!team)continue;
    const gk=m.gk?.[ti===m.a?'a':'b'];
    for(const pid of team.players||[]){const p=S.players[pid];if(!p||pid===gk)continue;
      const st=res[pid]=blank();st.mp=1;st.con=ga;
      if(gf>ga){st.w=1;st.pts+=cfg.win}
      if(ga===0)st.cs=1;
      if(p.pos==='DEF')st.pts+=cfg.defStart-cfg.defPerConceded*ga+(ga===0?cfg.csDEF:0);
      else if(ga===0)st.pts+=cfg.csATT;
    }}
  for(const e of m.events||[]){
    if(e.type==='goal'){
      if(e.scorer&&res[e.scorer]){res[e.scorer].g++;res[e.scorer].pts+=S.players[e.scorer].pos==='DEF'?cfg.goalDEF:cfg.goalATT}
      if(e.assist&&res[e.assist]){res[e.assist].a++;res[e.assist].pts+=cfg.assist}
    }else if(e.type==='og'&&e.scorer&&res[e.scorer]){res[e.scorer].og++;res[e.scorer].pts+=cfg.ownGoal}
  }
  return res;
}
let C=null;
function calc(){
  if(C&&C.v===ver)return C;
  const cfg=S.config,byWeek={},season={};
  for(const m of Object.values(S.matches)){
    if(!counts(m))continue;const w=S.weeks[m.weekId];if(!w)continue;
    const bw=byWeek[m.weekId]||(byWeek[m.weekId]={});
    for(const [pid,st] of Object.entries(matchPoints(m,w,cfg))){addStat(bw[pid]||(bw[pid]=blank()),st)}
  }
  const weeksAsc=Object.values(S.weeks).sort((a,b)=>a.date<b.date?-1:1);
  for(const w of weeksAsc)for(const [pid,st] of Object.entries(byWeek[w.id]||{})){const s=season[pid]||(season[pid]={...blank(),wk:0});addStat(s,st);s.wk++}
  C={v:ver,byWeek,season,weeksAsc,priceCache:{}};return C;
}
function priceInfo(pid,beforeDate){
  const c=calc(),key=pid+'|'+beforeDate;if(c.priceCache[key])return c.priceCache[key];
  const cfg=S.config,hist=[];
  for(const w of c.weeksAsc){if(w.date>=beforeDate)break;const st=c.byWeek[w.id]?.[pid];if(st&&st.mp>0)hist.push(st.pts)}
  const last=hist.slice(-cfg.formWeeks);let r;
  if(!last.length)r={price:cfg.priceNew,form:null,n:0};
  else{const avg=last.reduce((a,b)=>a+b,0)/last.length;r={price:clamp(Math.round(cfg.priceBase+avg*cfg.priceSlope),cfg.priceMin,cfg.priceMax),form:avg,n:last.length}}
  return c.priceCache[key]=r;
}

function teamIdxOf(w,pid){return (w.teams||[]).findIndex(t=>(t.players||[]).includes(pid))}
function teamOverflow(w,ids){const c={};for(const id of ids){const t=teamIdxOf(w,id);if(t>=0)c[t]=(c[t]||0)+1}const lim=S.config.maxPerTeam||99;return Object.entries(c).filter(([,n])=>n>lim).map(([t])=>+t)}
function pickPts(pk){const bw=calc().byWeek[pk.weekId]||{};let t=0;for(const p of pk.players||[])t+=(bw[p]?.pts||0)*(p===pk.captain?S.config.captain:1);return t}

function shrink(file){return new Promise((ok,bad)=>{const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const S2=320,c=document.createElement('canvas');c.width=c.height=S2;const m=Math.min(img.width,img.height);
    c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2*0.6,m,m,0,0,S2,S2);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',0.82))};
  img.onerror=()=>{URL.revokeObjectURL(url);bad()};img.src=url})}
async function sendPhoto(id,dataUrl){
  if(dataUrl)PHOTO_MEM[id]=dataUrl;else delete PHOTO_MEM[id];
  if(!API)return;
  const r=await fetch('/api/data',{method:'POST',headers:{'content-type':'application/json','x-pin':lsGet('f7_pin')||''},body:JSON.stringify({op:dataUrl?'photo':'unphoto',col:'players',id,photo:dataUrl})});
  if(r.status===401){lsSet('f7_pin',null);askPin();throw{code:'ต้องใส่รหัสก๊วน'}}
  if(!r.ok)throw{code:(await r.json().catch(()=>({}))).error||r.status};
}

function lastGk(m,side){const ti=side==='a'?m.a:m.b;const prev=matchesOf(m.weekId).filter(x=>x.played&&x.gk&&x.id!==m.id).sort((x,y)=>(y.at||0)-(x.at||0));
  for(const x of prev){if(x.a===ti&&x.gk.a)return x.gk.a;if(x.b===ti&&x.gk.b)return x.gk.b}return 'loan'}
function openRecord(mid){const m=S.matches[mid];if(!m)return;R={mid,events:clone(m.events||[]),step:null,delArm:false,gk:m.gk?{...m.gk}:{a:lastGk(m,'a'),b:lastGk(m,'b')}};renderRecord()}

    rcDel:async()=>{if(!R.delArm){R.delArm=true;renderRecord();return}const id=R.mid;closeModal();await save(()=>store.del('matches',id),'ลบแมตช์แล้ว')},

async function rebuildFixtures(wid,n){
  const ms=matchesOf(wid);for(const m of ms)if(!m.played)await store.del('matches',m.id);
  const played=ms.filter(m=>m.played),has=new Set(played.map(m=>[m.a,m.b].sort().join('-')));
  let o=played.reduce((x,m)=>Math.max(x,m.order??0),-1)+1;
  for(const [a,b] of roundRobin(n)){if(has.has([a,b].sort().join('-')))continue;await store.set('matches',rid('m_'),{weekId:wid,a,b,order:o++,played:false,events:[],votes:{}})}
}
const SWATCH=['#EE7A2E','#D93A3A','#E85A9B','#8E4FD1','#2F5BD3','#23A3C9','#1E9E62','#8BC34A','#EBC11B','#8D6E4F','#F4F4F0','#9AA09A','#26292A'];
function openTeamEdit(i){

      <label class="sw" style="display:grid;place-items:center;font-size:11px;background:var(--surface)" title="สีอื่น">อื่นๆ<input type="color" id="teCustom" value="${color}" style="position:absolute;opacity:0;width:1px;height:1px"></label></div></div>
    <div class="row"><span class="bib" style="background:${color};width:22px;height:28px"></span><span class="small muted">ตัวอย่างสี</span></div>
    <div class="row wrapx"><button class="btn pri" data-act="teSave">บันทึก</button><button class="btn ghost" data-act="close">ยกเลิก</button><span class="grow"></span>
      <button class="btn danger sm" data-act="teDel" ${usedInMatch&&matchesOf(w.id).some(m=>m.played&&(m.a===i||m.b===i))?'disabled title="ทีมนี้มีผลแมตช์แล้ว"':''}>${delArm?'กดอีกครั้งเพื่อลบทีม':'ลบทีม'}</button></div>`,{

    teDel:async()=>{if(!delArm){delArm=true;draw();return}closeModal();
      await save(async()=>{const teams=clone(S.weeks[S.weekId].teams);teams.splice(i,1);
        for(const m of matchesOf(w.id)){if(m.a===i||m.b===i){await store.del('matches',m.id);continue}
          if(m.a>i||m.b>i)await store.merge('matches',m.id,{a:m.a>i?m.a-1:m.a,b:m.b>i?m.b-1:m.b})}
        await store.merge('weeks',w.id,{teams})},'ลบทีมแล้ว คนในทีมกลับไปอยู่ในรายชื่อยังไม่มีทีม')}
  });const cu=$('#teCustom');if(cu)cu.oninput=()=>{color=cu.value;draw()}};
  draw();

function buildTeams(ids,n,date,posMap){
  const pos=i=>P(i)?.pos||posMap?.[i];
  const form=id=>{const f=priceInfo(id,date);return (f.form??(f.price-S.config.priceBase)/S.config.priceSlope)+Math.random()*0.01};
  const sortF=arr=>arr.sort((x,y)=>form(y)-form(x));
  const att=sortF(ids.filter(i=>pos(i)==='ATT')),def=sortF(ids.filter(i=>pos(i)==='DEF'));
  const teams=[...Array(n)].map((_,i)=>({name:'ทีม'+BIBS[i].n,bib:i,players:[],loans:[]}));
  att.forEach((id,k)=>{const r=Math.floor(k/n),c=k%n;teams[r%2?n-1-c:c].players.push(id)});
  def.forEach((id,k)=>{const r=Math.floor(k/n),c=k%n;teams[r%2?c:n-1-c].players.push(id)});
  return teams;
}
function roundRobin(n){const t=[...Array(n).keys()];if(n%2)t.push(-1);const m=t.length,out=[];for(let r=0;r<m-1;r++){for(let i=0;i<m/2;i++){const a=t[i],b=t[m-1-i];if(a>=0&&b>=0)out.push(r%2?[b,a]:[a,b])}t.splice(1,0,t.pop())}return out}

  addTeam:async()=>{const w=S.weeks[S.weekId],teams=clone(w.teams),used=new Set(teams.map(t=>t.bib));const b=[...BIBS.keys()].find(i=>!used.has(i))??0;
    teams.push({name:'ทีม'+(used.has(b)?' '+(teams.length+1):BIBS[b].n),bib:b,players:[],loans:[]});await save(()=>store.merge('weeks',w.id,{teams}),'เพิ่มทีมแล้ว')},
  refix:async()=>{const w=S.weeks[S.weekId];await save(()=>rebuildFixtures(w.id,w.teams.length),'จัดโปรแกรมใหม่แล้ว')},
  editTeam:el=>openTeamEdit(+el.dataset.t),
  addLoan:el=>{const i=+el.dataset.t;modal(`<h3>เพิ่มผู้เล่นยืมตัว</h3><p class="small muted" style="margin:0">ยืมตัวไม่ได้แต้ม Fantasy แต่ประตูยังนับในสกอร์</p><div class="field"><label for="lnName">ชื่อ</label><input type="text" id="lnName" placeholder="เช่น โกลยืม, เพื่อนพี่ตูน"></div>
    <div class="row"><button class="btn pri" data-act="lnSave">เพิ่ม</button><button class="btn ghost" data-act="close">ยกเลิก</button></div>`,{
    lnSave:async()=>{const v=$('#lnName').value.trim();if(!v)return;closeModal();const w=S.weeks[S.weekId],teams=clone(w.teams);(teams[i].loans||(teams[i].loans=[])).push(v);await save(()=>store.merge('weeks',w.id,{teams}))}});setTimeout(()=>$('#lnName')?.focus(),30)},
  rmLoan:async el=>{const w=S.weeks[S.weekId],teams=clone(w.teams);teams[+el.dataset.t].loans.splice(+el.dataset.k,1);await save(()=>store.merge('weeks',w.id,{teams}))},
  addMatch:()=>{const w=S.weeks[S.weekId],opts=w.teams.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join('');
    modal(`<h3>เพิ่มแมตช์</h3><div class="row wrapx"><select id="amA">${opts}</select><span>พบ</span><select id="amB">${w.teams.map((t,i)=>`<option value="${i}" ${i===1?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
     <div class="row"><button class="btn pri" data-act="amSave">เพิ่ม</button><button class="btn ghost" data-act="close">ยกเลิก</button></div>`,{
     amSave:async()=>{const a=+$('#amA').value,b=+$('#amB').value;if(a===b){toast('เลือกสองทีมที่ต่างกัน',true);return}closeModal();
      const o=matchesOf(w.id).reduce((x,m)=>Math.max(x,m.order??0),-1)+1;await save(()=>store.set('matches',rid('m_'),{weekId:w.id,a,b,order:o,played:false,events:[],votes:{}}),'เพิ่มแมตช์แล้ว')}})},
  lock:async()=>{const w=S.weeks[S.weekId];await save(()=>store.merge('weeks',w.id,{locked:!w.locked}),w.locked?'ปลดล็อกแล้ว':'ล็อกแล้ว')},
  record:el=>{if(!needMe())return;openRecord(el.dataset.m)},
  vote:async el=>{if(!needMe())return;const mid=el.dataset.m,v=+el.dataset.v,cur=S.matches[mid].votes?.[S.me]?.v;
    if(cur===v){await save(()=>store.merge('matches',mid,{votes:{[S.me]:{v:0,why:''}}}),'ยกเลิกโหวตแล้ว');return}
    if(v===1){await save(()=>store.merge('matches',mid,{votes:{[S.me]:{v:1,why:''}}}),'ยืนยันผลแล้ว');return}
    modal(`<h3>ค้านผลแมตช์นี้</h3><p class="small muted" style="margin:0">แมตช์จะไม่นับแต้มจนกว่าจะมีคนแก้ผล บอกว่าผิดตรงไหน</p><textarea id="whyT" placeholder="เช่น ลูกที่ 2 ต้นยิง ไม่ใช่บอส"></textarea>
     <div class="row"><button class="btn danger" data-act="whySave">ส่งคำค้าน</button><button class="btn ghost" data-act="close">ยกเลิก</button></div>`,{
     whySave:async()=>{const why=$('#whyT').value.trim().slice(0,200);closeModal();await save(()=>store.merge('matches',mid,{votes:{[S.me]:{v:-1,why}}}),'ส่งคำค้านแล้ว')}});setTimeout(()=>$('#whyT')?.focus(),30)},
  pick:el=>{const w=S.weeks[S.teamWeekId],d=S.draft[w.id],id=el.dataset.pid,cfg=S.config;
    if(d.players.includes(id)){d.players=d.players.filter(x=>x!==id);if(d.captain===id)d.captain=null}
    else{if(d.players.length>=cfg.squad){toast('ครบ '+cfg.squad+' คนแล้ว เอาคนออกก่อน',true);return}
      if(teamOverflow(w,[...d.players,id]).length){toast('เลือกจาก'+teamName(w,teamIdxOf(w,id))+'ได้ไม่เกิน '+cfg.maxPerTeam+' คน',true);return}d.players.push(id);if(!d.captain&&d.players.length===1)d.captain=id}
    render()},
  cap:el=>{const d=S.draft[S.teamWeekId];d.captain=el.dataset.pid;render()},
  savePick:async()=>{const w=S.weeks[S.teamWeekId];if(isLocked(w)){toast('สัปดาห์นี้ล็อกแล้ว',true);return}const d=S.draft[w.id];
    if(teamOverflow(w,d.players).length){toast('เลือกจากทีมเดียวกันเกิน '+S.config.maxPerTeam+' คน',true);return}
    const cost=d.players.reduce((s,id)=>s+priceInfo(id,w.date).price,0);
    await save(()=>store.set('picks',w.id+'_'+S.me,{weekId:w.id,manager:S.me,players:d.players,captain:d.captain,cost,at:Date.now()}),'ส่งทีมแล้ว')},
  cfgSave:async()=>{const o={};for(const [k] of CFG_LABELS){const v=parseFloat($('#cfg_'+k).value);o[k]=isFinite(v)?v:DEF_CFG[k]}o.squad=clamp(Math.round(o.squad),1,6);o.maxPerTeam=clamp(Math.round(o.maxPerTeam),1,6);o.formWeeks=clamp(Math.round(o.formWeeks),1,20);
    await save(()=>store.set('config','scoring',o),'บันทึกค่าแต้มแล้ว')},
  cfgReset:async()=>{await save(()=>store.set('config','scoring',{...DEF_CFG}),'คืนค่าเริ่มต้นแล้ว')},
  seedDemo:()=>seedDemo(),
  clearDemo:async()=>{await save(async()=>{for(const k of ['picks','matches','weeks','players'])for(const x of Object.values(S[k]))if(x.demo)await store.del(k,x.id)},'ลบข้อมูลตัวอย่างแล้ว');if(S.me&&!P(S.me)){S.me=null;lsSet('f7_me',null)}render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='scrim'){if(e.target===el)closeModal();return}
  const h=MH[a]||ACT[a];if(h){e.preventDefault();h(el,e)}});
document.addEventListener('change',async e=>{const el=e.target.closest('[data-change]');if(!el)return;const k=el.dataset.change;
  if(k==='me'&&el.value==='__new'){el.value=S.me||'';openPlayerForm(null,id=>setMe(id));return}
  if(k==='me'){S.me=el.value||null;lsSet('f7_me',S.me);render();return}
  if(k==='gk'&&R){R.gk[el.dataset.s]=el.value;return}
  if(k==='weekSel'){S.weekId=el.value;render();return}
  if(k==='teamWeekSel'){S.teamWeekId=el.value;render();return}
  if(k==='move'){if(el.value==='')return;const w=S.weeks[S.weekId],teams=clone(w.teams),pid=el.dataset.pid,from=+el.dataset.from,to=+el.value;
    if(from>=0)teams[from].players=teams[from].players.filter(x=>x!==pid);if(to>=0)teams[to].players.push(pid);
    await save(()=>store.merge('weeks',w.id,{teams}))}
});

/* ---------- demo data ---------- */
async function seedDemo(){
  const A=['บอส','ต้น','เจ','โอ๊ต','นัท','ปอนด์','กัส'],D=['เบียร์','ตูน','แบงค์','ปิง','เอ็ม','ฟลุ๊ค','หนึ่ง'];
  const ids=[],posMap={},nameMap={};
  toast('กำลังใส่ข้อมูลตัวอย่าง…');
  const ok=await save(async()=>{
    for(const [arr,pos] of [[A,'ATT'],[D,'DEF']])for(const n of arr){const id=rid('p_');ids.push(id);posMap[id]=pos;nameMap[id]=n;await store.set('players',id,{name:n,nick:n,pos,managerOnly:false,demo:true,createdAt:Date.now()})}
    await new Promise(r=>setTimeout(r,400));
    const dates=[todayISO(-14),todayISO(-7),todayISO()];
    for(let wi=0;wi<3;wi++){const d=dates[wi];if(S.weeks[d]&&!S.weeks[d].demo)continue;
      const att=ids.filter((_,i)=>(i+wi)%9!==0);const n=wi===1?3:2;
      const teams=buildTeams(att,n,d,posMap);if(wi===0)teams[1].loans=['โกลยืม'];
      await store.set('weeks',d,{date:d,attendees:att,teams,locked:false,demo:true});
      let o=0;for(const [a,b] of roundRobin(n)){const played=wi<2;const events=[];
        if(played)for(const side of ['a','b']){const t=teams[side==='a'?a:b].players,g=Math.floor(Math.random()*4);
          for(let k=0;k<g;k++){const atk=t.filter(x=>A.includes(nameById(x))),pool=Math.random()<.75&&atk.length?atk:t;const sc=pool[Math.floor(Math.random()*pool.length)];
            const mates=t.filter(x=>x!==sc);events.push({type:'goal',side,scorer:sc,assist:Math.random()<.6?mates[Math.floor(Math.random()*mates.length)]:null})}}
        await store.set('matches',rid('m_'),{weekId:d,a,b,order:o++,played,events,votes:{},by:played?ids[0]:null,at:Date.now(),demo:true});}
      await new Promise(r=>setTimeout(r,250));
      if(wi<2)for(const mgr of [ids[0],ids[7],ids[3],ids[10]]){const pool=att.filter(x=>x!==mgr).sort(()=>Math.random()-.5);let pk=[],cost=0;
        for(const x of pool){const pr=priceInfo(x,d).price;if(pk.length<S.config.squad&&cost+pr<=S.config.budget){pk.push(x);cost+=pr}}
        await store.set('picks',d+'_'+mgr,{weekId:d,manager:mgr,players:pk,captain:pk[0],cost,at:Date.now(),demo:true})}
    }
  });
  function nameById(id){return nameMap[id]}
  if(ok){toast('ใส่ข้อมูลตัวอย่างแล้ว');S.weekId=null;S.teamWeekId=null;render()}
}

/* ---------- boot ---------- */
render();
refresh(true);
setInterval(()=>{if(document.visibilityState==='visible')refresh()},4000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});
</script>
