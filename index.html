<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C7547">
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fantasy ก๊วน 7 คน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#F2F5EF; --surface:#FFFFFF; --sunk:#E8EDE4; --ink:#15211A; --muted:#5B6A61; --line:#D8E0D4;
  --turf:#1C7547; --turf-ink:#FFFFFF; --turf-soft:#DCEEDF;
  --att:#D4512A; --att-soft:#FBE3DA; --def:#2A58C4; --def-soft:#DDE6FA;
  --warn:#A86A12; --warn-soft:#F8EBD2; --bad:#B8322A; --bad-soft:#F7DEDB; --good:#1C7547;
  --shadow:0 1px 2px rgba(20,40,28,.06),0 4px 14px rgba(20,40,28,.05);
  --display:"Chakra Petch","Anuphan",system-ui,sans-serif;
  --body:"Anuphan","Noto Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1411; --surface:#161F1A; --sunk:#1D2822; --ink:#E5EDE7; --muted:#95A59B; --line:#2A3730;
    --turf:#3DB27A; --turf-ink:#06140C; --turf-soft:#173726;
    --att:#F07B55; --att-soft:#3A2119; --def:#7196F2; --def-soft:#1A2640;
    --warn:#E0A445; --warn-soft:#352812; --bad:#F0736A; --bad-soft:#3A1B19; --good:#3DB27A;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1411; --surface:#161F1A; --sunk:#1D2822; --ink:#E5EDE7; --muted:#95A59B; --line:#2A3730;
  --turf:#3DB27A; --turf-ink:#06140C; --turf-soft:#173726;
  --att:#F07B55; --att-soft:#3A2119; --def:#7196F2; --def-soft:#1A2640;
  --warn:#E0A445; --warn-soft:#352812; --bad:#F0736A; --bad-soft:#3A1B19; --good:#3DB27A;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:760px;margin:0 auto}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
.num,.tn{font-variant-numeric:tabular-nums}
.num{font-family:var(--display);font-weight:600}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:12px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{flex:none}
.logo h1{font-size:20px;letter-spacing:.02em}
.logo small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}
.me{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.me select{max-width:150px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--turf)}

main{padding-top:18px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);display:grid;gap:12px;min-width:0}
.card h2{font-size:17px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--display)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.wrapx{flex-wrap:wrap}
.grow{flex:1;min-width:0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:38px}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--turf);border-color:var(--turf);color:var(--turf-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--turf);outline-offset:2px}
select,input[type=text],input[type=number],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px;max-width:100%}
textarea{width:100%;font:inherit;color:inherit;min-height:70px}

.pos{display:inline-block;font-size:11px;font-weight:700;font-family:var(--display);letter-spacing:.06em;padding:1px 6px;border-radius:4px;flex:none}
.pfbar{display:grid;gap:8px}
.pfbar .row{gap:8px;flex-wrap:wrap}
.pfbar input[type=search]{flex:1;min-width:160px}
.seg.sm button{padding:6px 12px;font-size:13px}
.loanx{font-size:11px;color:var(--muted);font-family:var(--body);margin-left:2px}
.teamwarn{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600;margin:0 12px 6px}
.balwarn{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px}
button.pos{border:0;cursor:pointer;font:inherit;font-size:11px;font-weight:700;font-family:var(--display);letter-spacing:.06em;padding:1px 6px;border-radius:4px;outline:1px dashed currentColor;outline-offset:1px}
.pos.ATT{background:var(--att-soft);color:var(--att)}
.pos.DEF{background:var(--def-soft);color:var(--def)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--turf-soft);color:var(--good)}
.pill.wait{background:var(--sunk);color:var(--muted)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px 5px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:500;min-height:34px}
.chip[aria-pressed="true"]{background:var(--turf-soft);border-color:var(--turf);color:var(--ink)}
.chip[aria-pressed="true"]::after{content:"✓";color:var(--good);font-weight:700}

/* tables/lists */
.list{display:grid}
.li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .rk{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center}
.li.top1 .rk{color:var(--turf)}
.li .nm{font-weight:600;overflow-wrap:anywhere}
.li .sub{font-size:12.5px;color:var(--muted)}
.li .val{text-align:right}
.big{font-family:var(--display);font-size:22px;font-weight:700;line-height:1}
.clickable{cursor:pointer}
.clickable:hover .nm{text-decoration:underline;text-underline-offset:3px}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}

/* teams */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.team{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.team-h{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--sunk);font-weight:700}
.bib{width:14px;height:18px;border-radius:3px 3px 5px 5px;border:1px solid rgba(128,128,128,.5);flex:none}
.team-b{padding:6px 12px 12px;display:grid;gap:2px}
.tp{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.tp .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp select{min-height:28px;padding:2px 4px;font-size:12px;max-width:92px}
.loan{color:var(--muted);font-style:italic}
.av{width:28px;height:28px;border-radius:50%;flex:none;object-fit:cover;display:inline-grid;place-items:center;font-family:var(--display);font-weight:700;font-size:12px;color:#fff;vertical-align:middle;background:var(--sunk)}
.av.s{width:22px;height:22px;font-size:10px}.av.l{width:72px;height:72px;font-size:26px}.av.m{width:44px;height:44px;font-size:16px}
.nmrow{display:flex;align-items:center;gap:8px;min-width:0}
.photo-pick{display:flex;align-items:center;gap:14px}
.team-h .btn{padding:2px 8px;min-height:26px;font-size:12px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{position:relative;width:34px;height:34px;border-radius:8px;border:2px solid var(--line);cursor:pointer}
.sw[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.pool{border:1.5px dashed var(--line);border-radius:10px;padding:10px;display:grid;gap:6px}
.pool-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pool-row .who{display:flex;align-items:center;gap:6px;min-width:120px;flex:1}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;cursor:pointer;min-height:32px}
.tbtn:hover{background:var(--sunk)}

/* fixtures */
.fx{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.fx:first-child{border-top:0}
.fx .tA{display:flex;align-items:center;gap:6px;justify-content:flex-end;text-align:right;font-weight:600}
.fx .tB{display:flex;align-items:center;gap:6px;font-weight:600}
.fx .sc{font-family:var(--display);font-size:22px;font-weight:700;min-width:74px;text-align:center}
.fx .sc.pending{font-size:14px;color:var(--muted);font-weight:500}
.fx-meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.fx-ev{grid-column:1/-1;font-size:12.5px;color:var(--muted);text-align:center}
.why{grid-column:1/-1;font-size:13px;background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:6px 10px}

/* picker */
.budget{display:grid;gap:6px}
.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--turf);border-radius:99px;transition:width .2s}
.bar.over i{background:var(--bad)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1.5px dashed var(--line);border-radius:10px;padding:10px;min-height:86px;display:grid;align-content:space-between;gap:4px;text-align:center}
.slot.f{border-style:solid;border-color:var(--turf);background:var(--turf-soft)}
.slot .n{font-weight:700;overflow-wrap:anywhere}
.cap{border:1px solid var(--line);background:var(--surface);border-radius:99px;font-size:12px;font-weight:700;padding:2px 8px;cursor:pointer}
.cap[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pk{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;border:1px solid transparent;cursor:pointer;text-align:left;background:none;width:100%}
.pk:hover{background:var(--sunk)}
.pk[aria-pressed="true"]{border-color:var(--turf);background:var(--turf-soft)}
.pk .price{font-family:var(--display);font-weight:700;font-size:17px;min-width:34px;text-align:right}
.trend{font-size:11px;font-weight:700}
.trend.up{color:var(--good)} .trend.dn{color:var(--bad)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,14,10,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.scrim{align-items:center}}
.modal.wide{max-width:720px}
.sumimg{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);display:block}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px;display:grid;gap:14px;border:1px solid var(--line)}
.modal h3{font-size:18px}
.field{display:grid;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 16px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--sunk);border-radius:12px;padding:14px}
.board .t{display:grid;gap:8px;justify-items:center;text-align:center;font-weight:700}
.board .s{font-family:var(--display);font-size:44px;font-weight:700;line-height:1}
.ev{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.stepbox{border:1.5px solid var(--turf);border-radius:10px;padding:12px;display:grid;gap:10px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.stat{background:var(--sunk);border-radius:8px;padding:10px;display:grid;gap:2px}
.stat b{font-family:var(--display);font-size:20px}
.stat span{font-size:12px;color:var(--muted)}

.empty{text-align:center;padding:20px 8px;color:var(--muted);display:grid;gap:10px;justify-items:center}
.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-weight:600;font-size:14px;max-width:calc(100vw - 32px)}
.toast.err{background:var(--bad);color:#fff}
.hero{border:2px solid var(--turf);padding:18px}
.hero.live{border-color:var(--bad);box-shadow:0 0 0 4px var(--bad-soft)}
.livepill{display:inline-flex;align-items:center;gap:6px;background:var(--bad);color:#fff;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;padding:3px 10px;border-radius:99px}
.livepill::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);animation:pulse 1.2s infinite;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.bigboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.bigboard .t{display:grid;justify-items:center;gap:6px;text-align:center;font-weight:700;font-size:16px}
.bigboard .t .bib{width:26px;height:32px}
.bigboard .s{font-family:var(--display);font-size:56px;font-weight:700;line-height:1;white-space:nowrap}
.bigboard .vs{font-family:var(--display);font-size:22px;color:var(--muted)}
.goalbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goalbtn{min-height:64px;font-size:17px;font-weight:700;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.goalbtn:active{transform:scale(.98)}
.bigbtn{min-height:56px;font-size:17px;border-radius:12px;width:100%}
.chip.big{min-height:48px;padding:8px 14px 8px 10px;font-size:15px}
.fx.is-live{background:var(--bad-soft);border-radius:10px;padding-inline:8px}
.fx .no{grid-column:1/-1;font-size:11.5px;color:var(--muted);text-align:center;font-family:var(--display);letter-spacing:.06em}
.statline{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.statline span{display:inline-flex;align-items:baseline;gap:4px;background:var(--sunk);border-radius:8px;padding:3px 9px;font-size:12px;color:var(--muted)}
.statline b{font-family:var(--display);font-size:17px;color:var(--ink)}
.statline .pts{background:var(--turf-soft)}.statline .pts b{color:var(--good)}
.slot{position:relative}
.slot-x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px;line-height:1;display:grid;place-items:center;color:var(--muted)}
.slot-x:hover{color:var(--bad);border-color:var(--bad)}
.myteam{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mytile{background:var(--sunk);border-radius:12px;padding:12px 8px;display:grid;justify-items:center;gap:4px;text-align:center;position:relative}
.mytile.on{outline:2px solid var(--bad)}
.mytile .p{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.mytile .n{font-weight:700;overflow-wrap:anywhere}
.mytile .st{font-size:11.5px;color:var(--muted)}
.total{font-family:var(--display);font-size:44px;font-weight:700;line-height:1}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pchip{display:inline-flex;align-items:center;gap:5px;background:var(--sunk);border-radius:99px;padding:2px 10px 2px 3px;font-size:13px}
.pchip b{font-family:var(--display);font-size:15px}
.cfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.cfg input{width:100%}
.pitch-line{height:2px;background:repeating-linear-gradient(90deg,var(--turf) 0 10px,transparent 10px 16px);opacity:.5;border-radius:2px}
/* match page: steps, big touch targets */
:root{--score:#9A6A00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--score:#F2C14E}}
:root[data-theme="dark"]{--score:#F2C14E}
.wkhead{display:flex;gap:8px}
.wkhead select{flex:1;min-width:0;min-height:48px;border-radius:12px;font-size:16px;font-weight:600;padding:0 12px}
.wkhead .btn,.btn.mid{min-height:48px;border-radius:12px;font-size:15px;padding:0 14px}
.stepper{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stp{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;display:grid;gap:1px;text-align:left;cursor:pointer;min-height:66px;min-width:0}
.stp[aria-current="step"]{background:var(--turf-soft);border:1.5px solid var(--turf)}
.stp .k{font-family:var(--display);font-size:12px;font-weight:700;color:var(--muted)}
.stp .k.ok,.stp[aria-current="step"] .k{color:var(--turf)}
.stp b{font-size:15px}
.stp .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp .s.warn{color:var(--warn)}
.stepsec{display:grid;gap:10px;min-width:0}
h2.sh{font-size:20px;font-family:var(--body);font-weight:700}
.adm{font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:3px 9px;border-radius:99px;font-family:var(--body);white-space:nowrap}
.search{display:flex;align-items:center;gap:8px;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;flex:1;min-width:0;color:var(--muted)}
.search input{border:0!important;background:transparent!important;flex:1;min-width:0;min-height:44px;font-size:16px;outline:none;padding:0!important;color:var(--ink)}
.btn.outline{min-height:48px;border-radius:12px;border-color:var(--turf);color:var(--turf);background:transparent;font-weight:700;white-space:nowrap}
.segf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}

<div class="wrap">

      </div>

<script>
/* ---------- config & constants ---------- */
const DEF_CFG={goalATT:3,goalDEF:5,assist:2,ownGoal:-2,win:1,csATT:1,defStart:3,defPerConceded:1,csDEF:2,
  budget:30,squad:3,maxPerTeam:2,captain:2,priceNew:7,priceBase:5,priceSlope:0.5,priceMin:4,priceMax:15,formWeeks:4};
const CFG_LABELS=[
 ['goalATT','ประตู (ตัวบุก)'],['goalDEF','ประตู (ตัวรับ)'],['assist','แอสซิสต์'],['ownGoal','ทำเข้าประตูตัวเอง'],
 ['win','ทีมชนะ (ต่อแมตช์)'],['csATT','คลีนชีต (ตัวบุก)'],['defStart','แต้มตั้งต้นตัวรับ/แมตช์'],['defPerConceded','ตัวรับเสียแต้ม/ประตูที่โดน'],
 ['csDEF','โบนัสคลีนชีต (ตัวรับ)'],['budget','งบต่อสัปดาห์'],['squad','จำนวนนักเตะที่เลือก'],['maxPerTeam','เลือกจากทีมเดียวกันได้ไม่เกิน'],['captain','ตัวคูณกัปตัน'],
 ['priceNew','ราคานักเตะใหม่'],['priceBase','ราคาฐาน'],['priceSlope','ราคาเพิ่ม/แต้มฟอร์ม'],['priceMin','ราคาต่ำสุด'],['priceMax','ราคาสูงสุด'],['formWeeks','ฟอร์มคิดจากกี่สัปดาห์ล่าสุด']];
const BIBS=[{n:'ส้ม',c:'#EE7A2E'},{n:'น้ำเงิน',c:'#2F5BD3'},{n:'ขาว',c:'#F4F4F0'},{n:'ดำ',c:'#26292A'},{n:'เหลือง',c:'#EBC11B'}];
const POS_TH={ATT:'บุก',DEF:'รับ'};
const TABS=[['home','ตาราง'],['week','แมตช์'],['team','ทีม Fantasy'],['players','นักเตะ'],['rules','กติกา']];
const COLS=['players','weeks','matches','picks','config'];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=p=>p+Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o??null));
const fmt=n=>{n=+n||0;return Number.isInteger(n)?String(n):n.toFixed(1)};
const sgn=n=>(n>0?'+':'')+fmt(n);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function todayISO(off=0){const d=new Date(Date.now()+7*3600e3+off*864e5);return d.toISOString().slice(0,10)}
function thDate(iso,long){try{return new Date(iso+'T00:00:00').toLocaleDateString('th-TH',long?{weekday:'long',day:'numeric',month:'long',year:'numeric'}:{weekday:'short',day:'numeric',month:'short'})}catch{return iso}}
function lsGet(k){try{return localStorage.getItem(k)}catch{return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}}
function deepMerge(t,s){for(const k in s){if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])&&t[k]&&typeof t[k]==='object'&&!Array.isArray(t[k]))deepMerge(t[k],s[k]);else t[k]=s[k]}return t}

/* ---------- state & store ---------- */
const S={players:{},weeks:{},matches:{},picks:{},config:{...DEF_CFG},me:lsGet('f7_tok')?lsGet('f7_me'):null,tab:'home',weekId:null,teamWeekId:null,draft:{},loaded:false};
let API=false,ver=0,srvVer=-1;const RAW={players:{},weeks:{},matches:{},picks:{},config:{}};
function ingest(col,map){
  const out={};for(const [k,v] of Object.entries(map))out[k]={...v,id:k};
  if(col==='config')S.config={...DEF_CFG,...(map.scoring||{})};else S[col]=out;
  ver++;schedule();
}
const strip=d=>{const {id,...r}=d;return r};
/* live-recording ops: same logic as api/_match.js, applied optimistically here */
const MATCH_OPS = ['start', 'addEvent', 'rmEvent', 'endMatch', 'cancelLive', 'claim', 'evNames'];

const ownsLive = (cur, me) => !cur.recorder || cur.recorder === me;

function matchOp(cur, op, data, me, now) {
  if (!cur) return { error: 'not_found' };
  data = data || {};
  const doc = JSON.parse(JSON.stringify(cur));
  const evs = Array.isArray(doc.events) ? doc.events : (doc.events = []);
  const find = () => {
    if (data.eid) return evs.findIndex((e) => e && e.eid === data.eid);
    const i = Number(data.i);
    return Number.isInteger(i) && evs[i] && !evs[i].eid ? i : -1;
  };

  if (op === 'evNames') {
    // borrowed-player names are stats only, so anyone may fill them in at any time
    const i = find();
    if (i < 0) return { error: 'gone' };
    for (const k of ['sLoan', 'aLoan']) {
      const o = data[k];
      if (o && typeof o === 'object' && (o.pid || o.name)) evs[i][k] = o.pid ? { pid: String(o.pid).slice(0, 120) } : { name: String(o.name).slice(0, 40) };
      else if (k in data) delete evs[i][k];
    }
    return { doc };
  }
  if (!me) return { error: 'need_me' };

  if (op === 'start') {
    if (doc.live) return doc.recorder === me ? { same: true } : { error: 'busy', recorder: doc.recorder || null };
    if (doc.played) return { error: 'played' };
    Object.assign(doc, {
      live: true, recorder: me, by: me, startedAt: now, events: [], votes: {},
      gk: data.gk && typeof data.gk === 'object' ? { a: data.gk.a || 'loan', b: data.gk.b || 'loan' } : { a: 'loan', b: 'loan' },
    });
    if (data.roster && typeof data.roster === 'object') doc.roster = data.roster;
    return { doc };
  }
  if (op === 'claim') {
    if (!doc.live) return { error: 'not_live' };
    if (doc.recorder === me) return { same: true };
    doc.recorder = me;
    return { doc };
  }
  if (op === 'endMatch') {
    if (!doc.live) return doc.played ? { same: true } : { error: 'not_live' };
    if (!ownsLive(doc, me)) return { error: 'not_recorder', recorder: doc.recorder };
    Object.assign(doc, { live: false, played: true, at: now, by: me, votes: {} });
    delete doc.recorder;
    if (!doc.roster && data.roster && typeof data.roster === 'object') doc.roster = data.roster;
    return { doc };
  }
  if (!doc.live) return { error: 'not_live' };
  if (!ownsLive(doc, me)) return { error: 'not_recorder', recorder: doc.recorder };

  if (op === 'addEvent') {
    const ev = data.ev;
    if (!ev || typeof ev !== 'object' || !ev.eid || !['goal', 'og'].includes(ev.type) || !['a', 'b'].includes(ev.side)) return { error: 'bad_data' };
    if (evs.some((e) => e && e.eid === ev.eid)) return { same: true };
    evs.push(ev);
    return { doc };
  }
  if (op === 'rmEvent') {
    const i = find();
    if (i < 0) return { same: true };
    evs.splice(i, 1);
    return { doc };
  }
  if (op === 'cancelLive') {
    Object.assign(doc, { live: false, events: [], startedAt: null });
    delete doc.recorder;
    return { doc };
  }
  return { error: 'bad_op' };
}

const OP_ERR={busy:'มีคนเริ่มบันทึกแมตช์นี้ไปแล้ว',not_recorder:'มีคนอื่นบันทึกแมตช์นี้อยู่',not_live:'แมตช์นี้จบไปแล้ว',played:'แมตช์นี้บันทึกผลไปแล้ว',gone:'ประตูนี้ถูกลบไปแล้ว',need_me:'เลือกชื่อตัวเองก่อน',busy_lock:'เซิร์ฟเวอร์ยุ่ง ลองใหม่อีกครั้ง'};
function applyLocal(op,col,id,data){
  if(MATCH_OPS.includes(op)){const r=matchOp(RAW.matches[id],op,data,S.me,Date.now());if(r.error)throw{code:OP_ERR[r.error]||r.error,soft:true};if(r.same)return;RAW.matches[id]=r.doc;ingest('matches',clone(RAW.matches));return}
  if(op==='set')RAW[col][id]=clone(data);
  else if(op==='merge'){if(!RAW[col][id])throw{code:'not_found'};deepMerge(RAW[col][id],clone(data))}
  else delete RAW[col][id];
  ingest(col,clone(RAW[col]));
}
async function send(op,col,id,data){
  if(op==='set')data=strip(clone(data));
  applyLocal(op,col,id,data);
  if(!API)return;
  const r=await fetch('/api/data',{method:'POST',headers:{'content-type':'application/json','x-pin':lsGet('f7_pin')||'','x-me':S.me||'','x-tok':lsGet('f7_tok')||'','x-admin':lsGet('f7_admin')||''},body:JSON.stringify({op,col,id,data})});
  if(r.status===401){lsSet('f7_pin',null);askPin();throw{code:'ต้องใส่รหัสก๊วน'}}
  if(r.status===403){const j=await r.clone().json().catch(()=>({}));
    if(j.error==='need_admin'){lsSet('f7_admin',null);refresh(true);throw{code:'ต้องใช้รหัสผู้ดูแล'}}
    if(j.error==='no_admin_pin'){refresh(true);throw{code:'ยังไม่ได้ตั้ง ADMIN_PIN ใน Vercel'}}
    if(j.error==='locked'){refresh(true);throw{code:'GW นี้ล็อกทีมแล้ว'}}
    if(j.error==='closed'){refresh(true);throw{code:'GW นี้ปิดแล้ว แก้ไม่ได้'}}
    refresh(true);const who=S.me;forgetMe();if(who&&P(who))setTimeout(()=>becomeMe(who),50);throw{code:'ต้องยืนยันตัวตนด้วยรหัสก่อน'}}
  if(r.status===409||r.status===503){const j=await r.json().catch(()=>({}));refresh(true);throw{code:(j.error==='not_recorder'||j.error==='busy')&&j.recorder&&P(j.recorder)?nm(j.recorder)+' กำลังบันทึกแมตช์นี้อยู่':OP_ERR[j.error]||j.error,soft:true}}
  if(!r.ok){refresh(true);throw{code:(await r.json().catch(()=>({}))).error||r.status}}
}
const store={
  set:(col,id,data)=>send('set',col,id,data),
  merge:(col,id,data)=>send('merge',col,id,data),
  del:(col,id)=>send('del',col,id),
  op:(id,op,data)=>send(op,'matches',id,data||{})
};
let busy=false;
async function refresh(force){
  if(busy&&!force)return;busy=true;
  try{
    const r=await fetch('/api/data'+(force||srvVer<0?'':'?since='+srvVer),{cache:'no-store'});
    const j=await r.json();
    if(!r.ok)throw j;
    API=true;
    if(!j.same){srvVer=j.ver;for(const c of COLS){RAW[c]=j.data[c]||{};ingest(c,clone(RAW[c]))}}
    if(!S.loaded){S.loaded=true;render()}
    setBanner('');
    backfillPos();
  }catch(e){
    if(!S.loaded){S.loaded=true;setBanner(e&&e.error==='no_db'?'ยังไม่ได้เชื่อมฐานข้อมูล: เปิด Vercel > Storage แล้วเชื่อม Upstash Redis กับโปรเจกต์นี้ จากนั้นกด Redeploy':'ต่อเซิร์ฟเวอร์ไม่ได้ ตอนนี้เป็นโหมดทดลอง ข้อมูลที่กรอกจะไม่ถูกบันทึก');render()}
    else if(API)setBanner('การเชื่อมต่อสะดุด กำลังลองใหม่…');
  }finally{busy=false}
}
let bannerMsg='';function setBanner(m){if(m===bannerMsg)return;bannerMsg=m;render()}

/* ---------- scoring engine ---------- */
const blank=()=>({pts:0,g:0,a:0,cs:0,mp:0,w:0,con:0,og:0});
function addStat(t,s){for(const k in s)t[k]=(t[k]||0)+s[k]}
const isDisputed=m=>Object.values(m.votes||{}).some(x=>x&&x.v===-1);
const counts=m=>(m.played||m.live)&&!isDisputed(m);
function score(m){let a=0,b=0;for(const e of m.events||[]){if(e.side==='a')a++;else b++}return [a,b]}
const wcfg=w=>w?.closed&&w.cfg?{...S.config,...w.cfg}:S.config;
const rosterNow=(w,m)=>({a:[...(w.teams?.[m.a]?.players||[])],b:[...(w.teams?.[m.b]?.players||[])]});
const posTagW=(w,id,editable)=>{const ps=posAt(w,id);const ov=w?.pos?.[id]&&w.pos[id]!==P(id)?.pos;
  return editable?`<button class="pos ${ps}" data-act="gwPos" data-pid="${id}" title="กดเพื่อสลับตำแหน่งเฉพาะ GW นี้">${POS_TH[ps]}${ov?'*':''}</button>`:`<span class="pos ${ps}">${POS_TH[ps]||''}${ov?'*':''}</span>`};
function teamBalance(w,t){const pl=(t.players||[]).filter(P);const a=pl.filter(id=>posAt(w,id)==='ATT').length,d=pl.length-a;return {a,d,ok:Math.abs(a-d)<=1}}
const posAt=(w,pid)=>w?.pos?.[pid]||S.players[pid]?.pos;
function matchPoints(m,w,cfg){
  const res={};const [sa,sb]=score(m);
  for(const [ti,gf,ga] of [[m.a,sa,sb],[m.b,sb,sa]]){
    const sd=ti===m.a?'a':'b';const list=m.roster?.[sd]||w.teams?.[ti]?.players;if(!list)continue;
    const gk=m.gk?.[sd];
    for(const pid of list){const p=S.players[pid];if(!p||pid===gk)continue;
      const st=res[pid]=blank();st.mp=1;st.con=ga;
      if(gf>ga){st.w=1;st.pts+=cfg.win}
      if(ga===0)st.cs=1;
      if(posAt(w,pid)==='DEF')st.pts+=cfg.defStart-cfg.defPerConceded*ga+(ga===0?cfg.csDEF:0);
      else if(ga===0)st.pts+=cfg.csATT;
    }}
  for(const e of m.events||[]){
    if(e.type==='goal'){
      if(e.scorer&&res[e.scorer]){res[e.scorer].g++;res[e.scorer].pts+=posAt(w,e.scorer)==='DEF'?cfg.goalDEF:cfg.goalATT}
      if(e.assist&&res[e.assist]){res[e.assist].a++;res[e.assist].pts+=cfg.assist}
    }else if(e.type==='og'&&e.scorer&&res[e.scorer]){res[e.scorer].og++;res[e.scorer].pts+=cfg.ownGoal}
  }
  return res;
}
let C=null;
function calc(){
  if(C&&C.v===ver)return C;
  const cfg=S.config,byWeek={},season={};
  for(const m of Object.values(S.matches)){
    if(!counts(m))continue;const w=S.weeks[m.weekId];if(!w)continue;
    const bw=byWeek[m.weekId]||(byWeek[m.weekId]={});
    for(const [pid,st] of Object.entries(matchPoints(m,w,wcfg(w)))){addStat(bw[pid]||(bw[pid]=blank()),st)}
  }
  const weeksAsc=Object.values(S.weeks).sort((a,b)=>a.date<b.date?-1:1);
  for(const w of weeksAsc)for(const [pid,st] of Object.entries(byWeek[w.id]||{})){const s=season[pid]||(season[pid]={...blank(),wk:0});addStat(s,st);s.wk++}
  C={v:ver,byWeek,season,weeksAsc,priceCache:{}};return C;
}
function priceInfo(pid,beforeDate){
  const c=calc(),key=pid+'|'+beforeDate;if(c.priceCache[key])return c.priceCache[key];
  const cfg=S.config,hist=[];
  for(const w of c.weeksAsc){if(w.date>=beforeDate)break;const st=c.byWeek[w.id]?.[pid];if(st&&st.mp>0)hist.push(st.pts)}
  const last=hist.slice(-cfg.formWeeks);let r;
  if(!last.length)r={price:cfg.priceNew,form:null,n:0};
  else{const avg=last.reduce((a,b)=>a+b,0)/last.length;r={price:clamp(Math.round(cfg.priceBase+avg*cfg.priceSlope),cfg.priceMin,cfg.priceMax),form:avg,n:last.length}}
  return c.priceCache[key]=r;
}

function teamOverflow(w,ids){const c={};for(const id of ids){const t=teamIdxOf(w,id);if(t>=0)c[t]=(c[t]||0)+1}const lim=S.config.maxPerTeam||99;return Object.entries(c).filter(([,n])=>n>lim).map(([t])=>+t)}

function loanAgg(){if(LA&&LA.v===ver)return LA;const reg={},guest={};

  for(const m of Object.values(S.matches)){if(!counts(m))continue;for(const e of m.events||[]){if(e.type!=='goal')continue;if(e.scorer==='loan')add(e.sLoan,'g');if(e.assist==='loan')add(e.aLoan,'a')}}

function standings(wids){

  if(wids.length===1){const w=S.weeks[wids[0]];(w?.teams||[]).forEach((_,i)=>row(w,i))}
  for(const m of Object.values(S.matches)){if(!counts(m)||!set.has(m.weekId))continue;const w=S.weeks[m.weekId];if(!w)continue;

}

   ${hasLoanEv(e)&&(ctl||needsName(e))?`<button class="btn ${needsName(e)?'warnbtn':'ghost'}" data-act="evName" data-m="${m.id}" ${key}>${needsName(e)?'ใส่ชื่อ':'✎'}</button>`:''}
   ${ctl?`<button class="xbtn sm" data-act="liveRm" data-m="${m.id}" ${key} aria-label="ลบประตูนี้">×</button>`:''}</div>`}
function heroCard(w,ms){
  const total=ms.length,no=m=>ms.indexOf(m)+1;
  const lm=ms.find(m=>m.live),nx=ms.find(m=>!m.played&&!m.live);
  if(lm){const [a,b]=score(lm),mine=isRecorder(lm),evs=lm.events||[];
    const gkSel=sd=>{const ti=sd==='a'?lm.a:lm.b;return `<label class="gksel">${bibEl(w,ti)}<span>โกล</span><select data-change="liveGk" data-m="${lm.id}" data-s="${sd}"><option value="loan" ${(lm.gk?.[sd]||'loan')==='loan'?'selected':''}>ยืมตัว / คนนอก</option>${(w.teams?.[ti]?.players||[]).filter(P).map(id=>`<option value="${id}" ${lm.gk?.[sd]===id?'selected':''}>${esc(nm(id))}</option>`).join('')}</select></label>`};
    const gkTxt=['a','b'].map(sd=>{const g=lm.gk?.[sd];return g&&g!=='loan'?`โกล${esc(teamName(w,sd==='a'?lm.a:lm.b))}: ${esc(nm(g))}`:''}).filter(Boolean).join(' · ');
    return `<section class="card hero live"><div class="sec-h"><span class="livepill">LIVE</span><span class="small muted">แมตช์ที่ ${no(lm)}/${total}</span></div>
     <div class="bigboard"><div class="t">${bibEl(w,lm.a)}<span>${esc(teamName(w,lm.a))}</span></div><div class="s tn">${a} – ${b}</div><div class="t">${bibEl(w,lm.b)}<span>${esc(teamName(w,lm.b))}</span></div></div>
     ${mine?`<div class="goalbtns"><button class="goalbtn" data-act="liveGoal" data-m="${lm.id}" data-s="a" style="border-color:${bibOf(w,lm.a).c}">+ ประตู ${esc(teamName(w,lm.a))}</button><button class="goalbtn" data-act="liveGoal" data-m="${lm.id}" data-s="b" style="border-color:${bibOf(w,lm.b).c}">+ ประตู ${esc(teamName(w,lm.b))}</button></div>`
       :`<div class="recby"><span class="livedot"></span><span class="grow"><b>${esc(nm(recOf(lm)))}</b> กำลังบันทึกแมตช์นี้<br><span class="small muted">สกอร์อัปเดตเองทุกไม่กี่วินาที</span></span><button class="btn" data-act="claim" data-m="${lm.id}">ขอบันทึกแทน</button></div>`}
     <div class="evbox">${evs.map((e,i)=>evLine(w,lm,e,i,mine)).join('')||'<div class="small muted" style="padding:12px 14px">ยังไม่มีประตู</div>'}</div>
     ${mine?`<div class="row wrapx" style="gap:10px">${gkSel('a')}${gkSel('b')}</div>
     <button class="btn pri bigbtn" data-act="liveEnd" data-m="${lm.id}">จบแมตช์ · บันทึกผล ${a}–${b}</button>
     <div class="row wrapx">${nx?`<span class="small muted grow">ถัดไป: ${esc(teamName(w,nx.a))} vs ${esc(teamName(w,nx.b))}</span>`:'<span class="grow"></span>'}<button class="btn ghost" data-act="liveCancel" data-m="${lm.id}">ยกเลิกแมตช์นี้</button></div>`

  if(nx){const rest=(()=>{let best=null;for(const ti of [nx.a,nx.b]){let k=0;for(let j=ms.indexOf(nx)-1;j>=0&&ms[j].a!==ti&&ms[j].b!==ti;j--)k++;if(ms.slice(0,ms.indexOf(nx)).some(m=>m.a===ti||m.b===ti)&&k>=2&&(!best||k>best.k))best={ti,k}}return best})();
    return `<section class="card hero"><div class="sec-h"><div class="eyebrow">แมตช์ถัดไป · ${no(nx)}/${total}</div>${rest?`<span class="small muted">${esc(teamName(w,rest.ti))}พักมา ${rest.k} นัด</span>`:''}</div>
     <div class="bigboard"><div class="t">${bibEl(w,nx.a)}<span>${esc(teamName(w,nx.a))}</span></div><div class="vs">VS</div><div class="t">${bibEl(w,nx.b)}<span>${esc(teamName(w,nx.b))}</span></div></div>
     <button class="btn pri bigbtn play" data-act="liveStart" data-m="${nx.id}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>เริ่มแมตช์ · บันทึกสด</button>
     <button class="btn ghost mid" data-act="record" data-m="${nx.id}">กรอกผลทีเดียว</button></section>`}
  if(total)return `<section class="card hero"><div class="sec-h"><h2>เตะครบ ${total} แมตช์แล้ว</h2><button class="btn" data-act="tab" data-k="home">ตารางคะแนน</button></div>

}
function weekStep(w){
  if(S.wstep&&S.wstep.w===w.id)return S.wstep.k;
  return matchesOf(w.id).length?'play':(w.teams||[]).length?'teams':'checkin';
}
function vWeek(){
  const ws=weeksDesc();
  if(!S.weekId||!S.weeks[S.weekId])S.weekId=(ws.find(x=>liveOf(x.id))||ws[0])?.id||null;
  const w=S.weeks[S.weekId];
  const head=`<div class="wkhead"><select id="weekSel" data-change="weekSel" aria-label="เลือก GW">${ws.map(x=>`<option value="${x.id}" ${x.id===S.weekId?'selected':''}>${esc(gwLabel(x))}${x.closed?' · ปิดแล้ว':''}</option>`).join('')||'<option>ยังไม่มี GW</option>'}</select><button class="btn" data-act="newWeek">+ GW ใหม่</button></div>`;
  if(!w)return head+`<div class="card empty">ยังไม่มีวันเตะ กด "+ GW ใหม่" เพื่อเริ่ม</div>`;
  const ms=matchesOf(w.id),att=(w.attendees||[]).filter(P),nT=(w.teams||[]).length,step=weekStep(w);
  const badT=(w.teams||[]).filter(t=>(t.players||[]).length&&!teamBalance(w,t).ok).length;
  const done=ms.filter(m=>m.played).length;
  const st=(k,n,label,sub,warn,ok)=>`<button class="stp" data-act="wstep" data-k="${k}" ${step===k?'aria-current="step"':''}><span class="k ${ok?'ok':''}">ขั้น ${n}${ok&&step!==k?' ✓':''}</span><b>${label}</b><span class="s ${warn?'warn':''}">${sub}</span></button>`;
  const stepper=`<div class="stepper">${st('checkin',1,'เช็คชื่อ',`มา ${att.length} คน`,false,att.length>0)}${st('teams',2,'จัดทีม',nT?`${nT} ทีม${badT?` · ${badT} ไม่สมดุล`:''}`:'ยังไม่จัด',badT>0,nT>0&&!badT)}${st('play',3,'แข่ง',ms.length?`${done}/${ms.length} แมตช์`:'ยังไม่มีโปรแกรม',false,ms.length&&done===ms.length)}</div>`;
  const body=step==='checkin'?stepCheckin(w):step==='teams'?stepTeams(w):stepPlay(w);
  return head+stepper+body;
}
/* step 1: check-in */

  if(!list.length)return `<div class="empty small">${q?'ไม่พบชื่อนี้':f==='todo'?'เช็คครบทุกคนแล้ว':'ยังไม่มีใครเช็คชื่อ'}</div>`;
  return list.map(p=>`<button class="ck" data-act="att" data-pid="${p.id}" aria-pressed="${att.has(p.id)}">${avatar(p.id,'m')}<span class="nmx">${esc(nm(p.id))}</span>${posTagW(w,p.id,false)}<span class="box">${TICK}</span></button>`).join('');
}
function stepCheckin(w){
  const att=new Set((w.attendees||[]).filter(P)),rs=roster(),f=S.attF||'todo';
  const aC=rs.filter(p=>att.has(p.id)&&posAt(w,p.id)==='ATT').length,dC=rs.filter(p=>att.has(p.id)&&posAt(w,p.id)!=='ATT').length;

  return `<section class="stepsec"><div class="sec-h"><h2 class="sh">เช็คชื่อคนมาเตะ</h2><span class="adm">แอดมิน</span></div>
   <div class="row" style="gap:8px"><label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg><input type="search" id="attQ" placeholder="ค้นหาชื่อ" aria-label="ค้นหาชื่อ" value="${esc(S.attQ||'')}" autocomplete="off"></label>

   <div class="segf" role="group" aria-label="กรองรายชื่อ"><button data-act="attF" data-v="todo" aria-pressed="${f==='todo'}">ยังไม่เช็ค · ${todo}</button><button data-act="attF" data-v="in" aria-pressed="${f==='in'}">มาแล้ว · ${att.size}</button><button data-act="attF" data-v="all" aria-pressed="${f==='all'}">ทั้งหมด</button></div>
   ${rs.length?`<div class="rows" id="attList">${attRows(w)}</div>`:`<div class="card empty small">ยังไม่มีนักเตะ ไปเพิ่มที่แท็บนักเตะก่อน</div>`}
   <button class="btn ghost" data-act="newPlayer" style="justify-self:start">+ เพิ่มนักเตะใหม่</button>

/* step 2: teams */
function stepTeams(w){

  const closed=S.closedTeams||new Set();
  const card=(t,i)=>{const pl=(t.players||[]).filter(P),b=teamBalance(w,t),open=!closed.has(w.id+':'+i);
    const ord=[...pl.filter(id=>posAt(w,id)==='ATT'),...pl.filter(id=>posAt(w,id)!=='ATT')];
    return `<div class="tcard" data-open="${open?1:0}"><button class="tcard-h" data-act="tgTeam" data-t="${i}" aria-expanded="${open}">${bibEl(w,i)}<span class="tnm">${esc(t.name)}</span><span class="small muted tn">${pl.length} คน</span>
      ${pl.length?`<span class="pill ${b.ok?'ok':'warn'}">บุก ${b.a} · รับ ${b.d}</span>`:''}${CHEV}</button>
      ${open?`<div class="tcard-b">${pl.length&&!b.ok?`<div class="small" style="color:var(--warn)">ไม่สมดุล ควรเป็น ${Math.ceil(pl.length/2)}/${Math.floor(pl.length/2)} · กดชื่อเพื่อย้ายทีมหรือสลับตำแหน่ง</div>`:''}
       <div class="chips">${ord.map(id=>`<button class="pchipx" data-act="pSheet" data-pid="${id}">${avatar(id,'s')}${esc(nm(id))}${posTagW(w,id,false)}</button>`).join('')||'<span class="small muted">ยังไม่มีคน</span>'}
       ${(t.loans||[]).map((n,k)=>`<span class="pchipx loan">ยืม · ${esc(n)}<button class="xbtn sm" data-act="rmLoan" data-t="${i}" data-k="${k}" aria-label="ลบ ${esc(n)}">×</button></span>`).join('')}</div>
       <div class="row wrapx" style="gap:8px"><button class="btn" data-act="addLoan" data-t="${i}">+ ยืมตัว</button><button class="btn" data-act="editTeam" data-t="${i}">แก้ชื่อ/สี</button></div></div>`:''}</div>`};
  return `<section class="stepsec"><div class="sec-h"><h2 class="sh">จัดทีม</h2><span class="small muted">มา ${att.length} คน</span></div>

   <p class="small muted" style="margin:0">${played?'เริ่มเตะแล้ว จัดใหม่ทั้งหมดไม่ได้ แต่ยังกดชื่อเพื่อย้ายคนได้':'อัตโนมัติ: แบ่งบุก/รับให้แต่ละทีมเท่ากันและฟอร์มใกล้กัน · กดชื่อคนเพื่อย้ายทีม สลับตำแหน่ง หรือเอาออก'}</p>
   ${unassigned.length&&nT?`<div class="pool"><b class="small">ยังไม่มีทีม ${unassigned.length} คน · กดชื่อเพื่อใส่ทีม</b><div class="chips">${unassigned.map(id=>`<button class="pchipx" data-act="pSheet" data-pid="${id}">${avatar(id,'s')}${esc(nm(id))}${posTagW(w,id,false)}</button>`).join('')}</div></div>`:''}
   ${nT?w.teams.map(card).join(''):`<div class="card empty small">ยังไม่ได้จัดทีม เลือกจำนวนทีมแล้วกดจัดอัตโนมัติ</div>`}
   ${nT&&nT<8&&!w.closed?`<button class="btn" data-act="addTeam" style="justify-self:start">+ เพิ่มทีม</button>`:''}</section>
   <div class="bbar"><div class="grow"><div class="bnum">${nT} ทีม</div><div class="small muted">${ms.length} แมตช์${unassigned.length&&nT?` · ยังไม่มีทีม ${unassigned.length}`:''}</div></div><button class="btn pri bbtn" data-act="wstep" data-k="play">ถัดไป: แข่ง →</button></div>`;

/* step 3: play */
function mStatus(m){
  if(m.live)return ['LIVE','live'];
  if(!m.played)return null;
  return isDisputed(m)?['มีคนค้าน','warn']:['นับแล้ว','ok'];
}
function stepPlay(w){
  const ms=matchesOf(w.id),nT=(w.teams||[]).length,nx=ms.find(m=>!m.played&&!m.live),locked=isLocked(w);
  const rows=ms.map((m,k)=>{const [a,b]=score(m),s=mStatus(m)||(m===nx?['ถัดไป','next']:['รอเตะ','wait']);
    return `<button class="mrow ${m.live?'live':m===nx?'next':''}" data-act="mSheet" data-m="${m.id}"><span class="no">${k+1}</span>
     <span class="mt">${bibEl(w,m.a)}<span class="n">${esc(teamName(w,m.a))}</span><span class="msc ${m.played||m.live?'':'muted'}">${m.played||m.live?`${a}–${b}`:'vs'}</span><span class="n">${esc(teamName(w,m.b))}</span>${bibEl(w,m.b)}</span>
     <span class="stchip ${s[1]}">${s[0]}${(m.events||[]).some(needsName)?' ·✎':''}</span></button>`}).join('');
  const pts=calc().byWeek[w.id]||{};
  const tops=Object.entries(pts).filter(([id])=>P(id)).sort((a,b)=>b[1].pts-a[1].pts);
  const ptsCard=tops.length?`<section class="card"><h2>แต้มนักเตะ GW นี้ ${liveOf(w.id)?'<span class="livedot"></span>':''}</h2><div class="tbl-wrap"><table><thead><tr><th>นักเตะ</th><th class="r">แมตช์</th><th class="r">ยิง</th><th class="r">แอส</th><th class="r">คลีนชีต</th><th class="r">เสีย</th><th class="r">แต้ม</th></tr></thead><tbody>
    ${tops.map(([id,s])=>`<tr class="clickable" data-act="profile" data-pid="${id}"><td>${playingNow(w,id)?'<span class="livedot"></span> ':''}${posTag(P(id))} ${esc(nm(id))}</td><td class="r tn">${s.mp}</td><td class="r tn">${s.g}</td><td class="r tn">${s.a}</td><td class="r tn">${s.cs}</td><td class="r tn">${s.con}</td><td class="r num">${fmt(s.pts)}</td></tr>`).join('')}</tbody></table></div></section>`:'';
  return `${ms.length?heroCard(w,ms):''}
   <section class="stepsec"><div class="sec-h"><h2 class="sh">โปรแกรม <span class="muted num" style="font-size:15px">${ms.filter(m=>m.played).length}/${ms.length}</span></h2><button class="btn mid" data-act="manage">จัดการ ⋯</button></div>
   <div class="small muted">${w.closed?'ปิด GW แล้ว · แต้มล็อกถาวร':w.unlocked&&weekStarted(w)?'<b style="color:var(--warn)">แอดมินเปิดให้แก้ทีม Fantasy ชั่วคราว</b>':locked?'ทีม Fantasy ล็อกแล้ว':'ทีม Fantasy ยังเลือกได้ · ล็อกเองเมื่อเริ่มแมตช์แรก'}</div>
   ${ms.length?`<div class="rows">${rows}</div>`:`<div class="card empty small">${nT>=2?'ยังไม่มีแมตช์ กด "จัดการ" เพื่อจัดโปรแกรม':'จัดทีมก่อน แล้วระบบจะจัดโปรแกรมให้'}</div>`}</section>
   ${ptsCard}`;
}

/* ---------- bottom sheets (player / match / manage) ---------- */
function renderSheet(){
  const root=$('#sheetRoot');if(!root)return;
  const sh=S.sheet;let html='';
  if(sh){const w=S.weeks[S.weekId];
    html=!w||S.tab!=='week'?'':sh.k==='player'?sheetPlayer(w,sh.pid):sh.k==='match'?sheetMatch(w,sh.mid):sh.k==='manage'?sheetManage(w):'';
    if(!html)S.sheet=null;}
  const full=html?`<div class="sscrim" data-act="sheetScrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`:'';
  if(root.dataset.h===full)return;
  const sc=root.querySelector('.sheet')?.scrollTop||0;
  root.innerHTML=full;root.dataset.h=full;
  const n=root.querySelector('.sheet');if(n)n.scrollTop=sc;
  document.body.style.overflow=full?'hidden':'';
}
function openSheet(o){S.sheet=o;renderSheet()}
function closeSheet(){S.sheet=null;renderSheet()}
const shHead=(title,extra)=>`<div class="sh-h"><h3>${title}</h3>${extra||''}<button class="xbtn" data-act="sheetClose" aria-label="ปิด">×</button></div>`;
function sheetPlayer(w,pid){
  const p=P(pid);if(!p)return '';
  const ti=teamIdxOf(w,pid),cur=posAt(w,pid),locked=posLocked(w)||w.closed;
  const balIf=(t,swap)=>{const pl=(t.players||[]).filter(P);let a=0,d=0;for(const id of pl){const ps=id===pid&&swap?(cur==='ATT'?'DEF':'ATT'):posAt(w,id);ps==='ATT'?a++:d++}return {a,d}};
  const other=cur==='ATT'?'DEF':'ATT';
  const after=ti>=0?balIf(w.teams[ti],true):null;
  return `${shHead(`<span class="row" style="gap:10px">${avatar(pid,'m')}<span>${esc(nm(pid))}</span></span>`)}

const PF_SORT=[['form','ฟอร์ม'],['pts','แต้มรวม'],['g','ประตู'],['a','แอสซิสต์'],['cs','คลีนชีต'],['mp','แมตช์'],['price','ราคา'],['name','ชื่อ']];
function playerRows(){
  const c=calc(),pd=prevWeekDate(),L=loanAgg(),f=S.pf;
  const lastW=weeksDesc().find(w=>matchesOf(w.id).some(counts));const came=new Set(lastW?.attendees||[]);
  const q=f.q.trim().toLowerCase();
  let rows=roster().map(p=>{const cur=priceInfo(p.id,NOW),prev=pd?priceInfo(p.id,pd):cur;const s0=c.season[p.id]||blank();const lg=L.reg[p.id]||{g:0,a:0};
    const s1=f.mode==='all'?{...s0,g:s0.g+lg.g,a:s0.a+lg.a}:s0;return {p,cur,diff:cur.price-prev.price,s:s1,lg}});
  rows=rows.filter(r=>(!q||((r.p.name||'')+' '+(r.p.nick||'')).toLowerCase().includes(q))&&(f.pos==='all'||r.p.pos===f.pos)&&(f.who!=='last'||came.has(r.p.id)));
  const key={form:r=>r.cur.form??-99,pts:r=>r.s.pts,g:r=>r.s.g,a:r=>r.s.a,cs:r=>r.s.cs,mp:r=>r.s.mp,price:r=>r.cur.price}[f.sort];

  return rows;
}

function shrink(file){return new Promise((ok,bad)=>{const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const S2=320,c=document.createElement('canvas');c.width=c.height=S2;const m=Math.min(img.width,img.height);
    c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2*0.6,m,m,0,0,S2,S2);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',0.82))};
  img.onerror=()=>{URL.revokeObjectURL(url);bad()};img.src=url})}

  if(!r.ok)throw{code:(await r.json().catch(()=>({}))).error||r.status};
}

// once a GW has a recorded match, each player's position that GW is stored on the week,
// so changing someone's position later does not rewrite past points
function missingPos(w){const out={};for(const t of w.teams||[])for(const pid of t.players||[])if(P(pid)&&!w.pos?.[pid])out[pid]=P(pid).pos;return out}
async function freezePos(wid){const w=S.weeks[wid];if(!w)return;const add=missingPos(w);if(Object.keys(add).length)await store.merge('weeks',wid,{pos:add})}
const posTried=new Set();
function backfillPos(){if(!API)return;for(const w of Object.values(S.weeks)){if(posTried.has(w.id))continue;
  if(!matchesOf(w.id).some(m=>m.played))continue;posTried.add(w.id);if(w.closed)continue;if(Object.keys(missingPos(w)).length)freezePos(w.id).catch(()=>{});
  for(const m of matchesOf(w.id))if(m.played&&!m.roster)store.merge('matches',m.id,{roster:rosterNow(w,m)}).catch(()=>{})}}

/* ---------- team generation ---------- */
// order matches so every team rests about equally: nobody sits more than ceil((teams-1)/2) games in a row
// (2 for 4–5 teams), back-to-back games are avoided, and repeat pairings come last
function planMatches(n,count,history){
  history=history||[];if(n<2)return [];
  const maxRest=Math.max(1,Math.ceil((n-1)/2));
  const wait=Array(n).fill(0),games=Array(n).fill(0),pc={},pk=(a,b)=>a<b?a+'-'+b:b+'-'+a;let last=null;
  const apply=(a,b)=>{for(let t=0;t<n;t++)wait[t]++;wait[a]=0;wait[b]=0;games[a]++;games[b]++;pc[pk(a,b)]=(pc[pk(a,b)]||0)+1;last=pk(a,b)};
  for(const [a,b] of history)if(a<n&&b<n)apply(a,b);
  const pairs=[];for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)pairs.push([i,j]);
  const out=[];
  for(let k=0;k<count;k++){
    const must=[...Array(n).keys()].filter(t=>wait[t]>=maxRest).sort((x,y)=>wait[y]-wait[x]||games[x]-games[y]).slice(0,2);
    let valid=pairs.filter(p=>must.every(t=>p.includes(t)));if(!valid.length)valid=pairs;
    let best=null,bs=Infinity;
    for(const [i,j] of valid){const jp=t=>games[t]>0&&wait[t]===0;
      const sc=(pc[pk(i,j)]||0)*100+(pk(i,j)===last?1000:0)+(jp(i)?60:0)+(jp(j)?60:0)-(wait[i]+wait[j])*10+(games[i]+games[j])*8;
      if(sc<bs){bs=sc;best=[i,j]}}
    const [a,b]=games[best[0]]<=games[best[1]]?best:[best[1],best[0]];
    out.push([a,b]);apply(a,b);
  }
  return out;
}
const rrCount=n=>n*(n-1)/2;
async function rebuildFixtures(wid,n,count){
  const w=S.weeks[wid];count=count||w?.nMatches||rrCount(n);
  const ms=matchesOf(wid);for(const m of ms)if(!m.played&&!m.live)await store.del('matches',m.id);
  const kept=ms.filter(m=>m.played||m.live);
  let o=kept.reduce((x,m)=>Math.max(x,m.order??0),-1)+1;
  if(w&&w.nMatches!==count)await store.merge('weeks',wid,{nMatches:count});
  for(const [a,b] of planMatches(n,Math.max(0,count-kept.length),kept.map(m=>[m.a,m.b])))
    await store.set('matches',rid('m_'),{weekId:wid,a,b,order:o++,played:false,events:[],votes:{}});
}

function buildTeams(ids,n,date,posMap){
  const pos=i=>posMap?.[i]||P(i)?.pos;
  const form=id=>{const f=priceInfo(id,date);return (f.form??(f.price-S.config.priceBase)/S.config.priceSlope)+Math.random()*0.01};
  const sortF=arr=>arr.sort((x,y)=>form(y)-form(x));
  const att=sortF(ids.filter(i=>pos(i)==='ATT')),def=sortF(ids.filter(i=>pos(i)==='DEF'));
  const teams=[...Array(n)].map((_,i)=>({name:'ทีม'+BIBS[i].n,bib:i,players:[],loans:[]}));
  // strongest first; each player joins the team with the fewest players, then fewest of that position, then lowest strength
  const str=Array(n).fill(0),cnt={ATT:Array(n).fill(0),DEF:Array(n).fill(0)};
  const place=(arr,ps)=>{for(const id of arr){let b=0;for(let t=1;t<n;t++){const d=teams[t].players.length-teams[b].players.length||cnt[ps][t]-cnt[ps][b]||str[t]-str[b];if(d<0)b=t}
    teams[b].players.push(id);cnt[ps][b]++;str[b]+=Math.max(0,form(id))}};
  place(att,'ATT');place(def,'DEF');
  return teams;
}
function roundRobin(n){const t=[...Array(n).keys()];if(n%2)t.push(-1);const m=t.length,out=[];for(let r=0;r<m-1;r++){for(let i=0;i<m/2;i++){const a=t[i],b=t[m-1-i];if(a>=0&&b>=0)out.push(r%2?[b,a]:[a,b])}t.splice(1,0,t.pop())}return out}

  addTeam:async()=>{const w=S.weeks[S.weekId],teams=clone(w.teams),used=new Set(teams.map(t=>t.bib));const b=[...BIBS.keys()].find(i=>!used.has(i))??0;
    teams.push({name:'ทีม'+(used.has(b)?' '+(teams.length+1):BIBS[b].n),bib:b,players:[],loans:[]});await save(()=>store.merge('weeks',w.id,{teams}),'เพิ่มทีมแล้ว')},
  refix:()=>{const w=S.weeks[S.weekId];const c=clamp(S.nm&&S.nm.w===w.id?S.nm.v:(w.nMatches||rrCount(w.teams.length)),1,40);
    withAdmin(()=>save(()=>rebuildFixtures(w.id,w.teams.length,c),'จัดโปรแกรม '+c+' แมตช์แล้ว'))},
  nmStep:el=>{const w=S.weeks[S.weekId],ms=matchesOf(w.id);const cur=S.nm&&S.nm.w===w.id?S.nm.v:(w.nMatches||ms.length||rrCount(w.teams.length));
    S.nm={w:w.id,v:clamp(cur+(+el.dataset.d),Math.max(1,ms.filter(m=>m.played||m.live).length),40)};renderSheet()},
  editTeam:el=>openTeamEdit(+el.dataset.t),
  addLoan:el=>{const i=+el.dataset.t;modal(`<h3>เพิ่มผู้เล่นยืมตัว</h3><p class="small muted" style="margin:0">ยืมตัวไม่ได้แต้ม Fantasy แต่ประตูยังนับในสกอร์</p><div class="field"><label for="lnName">ชื่อ</label><input type="text" id="lnName" placeholder="เช่น โกลยืม, เพื่อนพี่ตูน"></div>
    <div class="row"><button class="btn pri" data-act="lnSave">เพิ่ม</button><button class="btn ghost" data-act="close">ยกเลิก</button></div>`,{
    lnSave:async()=>{const v=$('#lnName').value.trim();if(!v)return;closeModal();const w=S.weeks[S.weekId],teams=clone(w.teams);(teams[i].loans||(teams[i].loans=[])).push(v);await save(()=>store.merge('weeks',w.id,{teams}))}});setTimeout(()=>$('#lnName')?.focus(),30)},
  rmLoan:async el=>{const w=S.weeks[S.weekId],teams=clone(w.teams);teams[+el.dataset.t].loans.splice(+el.dataset.k,1);await save(()=>store.merge('weeks',w.id,{teams}))},
  addMatch:()=>{const w=S.weeks[S.weekId],opts=w.teams.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join('');
    modal(`<h3>เพิ่มแมตช์</h3><div class="row wrapx"><select id="amA">${opts}</select><span>พบ</span><select id="amB">${w.teams.map((t,i)=>`<option value="${i}" ${i===1?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
     <div class="row"><button class="btn pri" data-act="amSave">เพิ่ม</button><button class="btn ghost" data-act="close">ยกเลิก</button></div>`,{
     amSave:async()=>{const a=+$('#amA').value,b=+$('#amB').value;if(a===b){toast('เลือกสองทีมที่ต่างกัน',true);return}closeModal();
      const o=matchesOf(w.id).reduce((x,m)=>Math.max(x,m.order??0),-1)+1;await save(()=>store.set('matches',rid('m_'),{weekId:w.id,a,b,order:o,played:false,events:[],votes:{}}),'เพิ่มแมตช์แล้ว')}})},
  unlockFan:()=>{const w=S.weeks[S.weekId];withAdmin(()=>save(()=>store.merge('weeks',w.id,{unlocked:!w.unlocked}),w.unlocked?'ล็อกทีม Fantasy แล้ว':'ปลดล็อกแล้ว ทุกคนแก้ทีม Fantasy ได้'))},
  lock:()=>{const w=S.weeks[S.weekId];withAdmin(()=>save(()=>store.merge('weeks',w.id,{locked:!w.locked,unlocked:false}),w.locked?'ปลดล็อกแล้ว':'ล็อกแล้ว'))},
  record:el=>{if(!needMe())return;openRecord(el.dataset.m)},
  liveStart:async el=>{if(!needMe())return;const m=S.matches[el.dataset.m];if(!m)return;const cur=liveOf(m.weekId);
    if(cur&&cur.id!==m.id){toast('จบแมตช์ที่กำลังเตะก่อน',true);return}
    closeSheet();S.wstep={w:m.weekId,k:'play'};
    const ok=await save(async()=>{await store.op(m.id,'start',{gk:{a:lastGk(m,'a'),b:lastGk(m,'b')},roster:rosterNow(S.weeks[m.weekId],m)});await freezePos(m.weekId)},'เริ่มแมตช์แล้ว · คุณเป็นคนบันทึก');
    if(ok)window.scrollTo({top:0,behavior:'smooth'})},
  liveGoal:el=>{if(!needMe())return;const m=S.matches[el.dataset.m];pickGoal(m,el.dataset.s,ev=>{
    ev.eid=rid('e_');ev.t=Date.now();
    const go=()=>save(()=>store.op(m.id,'addEvent',{ev}),'ประตู! '+(ev.type==='og'?'เข้าประตูตัวเอง':scorerLbl(ev)));
    const dup=(S.matches[m.id].events||[]).filter(e=>e.side===ev.side&&e.type===ev.type&&e.scorer===ev.scorer&&ev.t-(e.t||0)<30000).pop();
    if(!dup){go();return}
    const sec=Math.max(1,Math.round((ev.t-dup.t)/1000));
    modal(`<h3>บันทึกซ้ำหรือเปล่า?</h3><p style="margin:0">เพิ่งบันทึกประตู <b>${esc(ev.type==='og'?nm(ev.scorer)+' (เข้าตัวเอง)':scorerLbl(ev))}</b> ไปเมื่อ ${sec} วินาทีก่อน ลูกนี้เป็นอีกลูกใช่ไหม?</p>
      <div class="g2"><button class="btn bigbtn" data-act="close">ไม่ใช่ ยกเลิก</button><button class="btn pri bigbtn" data-act="dupOk">ใช่ อีกลูก</button></div>`,{dupOk:()=>{closeModal();go()}})})},
  liveRm:async el=>{if(el.dataset.arm!=='1'){el.dataset.arm='1';el.textContent='ลบ?';el.style.width='auto';el.style.padding='0 12px';el.style.borderRadius='10px';el.style.color='var(--bad)';el.style.borderColor='var(--bad)';setTimeout(()=>{if(el.isConnected&&el.dataset.arm==='1'){el.dataset.arm='';el.textContent='×';el.removeAttribute('style')}},3000);return}
    const m=S.matches[el.dataset.m];await save(()=>store.op(m.id,'rmEvent',el.dataset.e?{eid:el.dataset.e}:{i:+el.dataset.i}),'ลบประตูแล้ว')},
  liveEnd:async el=>{const m=S.matches[el.dataset.m];const [a,b]=score(m);
    await save(async()=>{await store.op(m.id,'endMatch',{roster:m.roster||rosterNow(S.weeks[m.weekId],m)});await freezePos(m.weekId)},'จบแมตช์ '+a+'–'+b+' บันทึกแล้ว')},
  liveCancel:async el=>{if(el.dataset.arm!=='1'){el.dataset.arm='1';el.textContent='กดอีกครั้งเพื่อยกเลิกแมตช์นี้';return}
    const m=S.matches[el.dataset.m];await save(()=>store.op(m.id,'cancelLive'),'ยกเลิกแล้ว แมตช์กลับเป็นยังไม่เตะ')},
  claim:el=>{if(!needMe())return;const m=S.matches[el.dataset.m];if(!m)return;
    modal(`<h3>ขอบันทึกแทน ${esc(nm(m.recorder))}?</h3><p style="margin:0">ใช้เมื่อคนบันทึกแบตหมดหรือออกจากสนาม หลังกด ${esc(nm(m.recorder))} จะกดเพิ่มประตูไม่ได้ และคุณจะเป็นคนบันทึกต่อจากสกอร์ปัจจุบัน</p>
      <div class="g2"><button class="btn bigbtn" data-act="close">ยกเลิก</button><button class="btn pri bigbtn" data-act="claimOk">บันทึกแทน</button></div>`,{claimOk:async()=>{closeModal();await save(()=>store.op(m.id,'claim'),'ตอนนี้คุณเป็นคนบันทึกแมตช์นี้')}})},
  goLive:()=>{closeSheet();window.scrollTo({top:0,behavior:'smooth'})},
  vote:async el=>{if(!needMe())return;const mid=el.dataset.m,v=+el.dataset.v,cur=S.matches[mid].votes?.[S.me]?.v;
    if(cur===v){await save(()=>store.merge('matches',mid,{votes:{[S.me]:{v:0,why:''}}}),'ยกเลิกโหวตแล้ว');return}
    if(v===1){await save(()=>store.merge('matches',mid,{votes:{[S.me]:{v:1,why:''}}}),'ยืนยันผลแล้ว');return}
    modal(`<h3>ค้านผลแมตช์นี้</h3><p class="small muted" style="margin:0">แมตช์จะไม่นับแต้มจนกว่าจะมีคนแก้ผล บอกว่าผิดตรงไหน</p><textarea id="whyT" placeholder="เช่น ลูกที่ 2 ต้นยิง ไม่ใช่บอส"></textarea>
     <div class="row"><button class="btn danger" data-act="whySave">ส่งคำค้าน</button><button class="btn ghost" data-act="close">ยกเลิก</button></div>`,{
     whySave:async()=>{const why=$('#whyT').value.trim().slice(0,200);closeModal();await save(()=>store.merge('matches',mid,{votes:{[S.me]:{v:-1,why}}}),'ส่งคำค้านแล้ว')}});setTimeout(()=>$('#whyT')?.focus(),30)},
  pick:el=>{const w=S.weeks[S.teamWeekId],d=S.draft[w.id],id=el.dataset.pid,cfg=S.config;
    if(d.players.includes(id)){d.players=d.players.filter(x=>x!==id);if(d.captain===id)d.captain=d.players[0]||null}
    else{if(d.players.length>=cfg.squad){toast('ครบ '+cfg.squad+' คนแล้ว เอาคนออกก่อน',true);return}
      if(teamOverflow(w,[...d.players,id]).length){toast('เลือกจาก'+teamName(w,teamIdxOf(w,id))+'ได้ไม่เกิน '+cfg.maxPerTeam+' คน',true);return}d.players.push(id);if(!d.captain)d.captain=id}
    render()},
  cap:el=>{const d=S.draft[S.teamWeekId];d.captain=el.dataset.pid;render()},
  savePick:async()=>{const w=S.weeks[S.teamWeekId];if(isLocked(w)){toast('สัปดาห์นี้ล็อกแล้ว',true);return}const d=S.draft[w.id];
    if(teamOverflow(w,d.players).length){toast('เลือกจากทีมเดียวกันเกิน '+S.config.maxPerTeam+' คน',true);return}
    const cost=d.players.reduce((s,id)=>s+priceInfo(id,w.date).price,0);
    await save(()=>store.set('picks',w.id+'_'+S.me,{weekId:w.id,manager:S.me,players:d.players,captain:d.captain,cost,at:Date.now()}),'ส่งทีมแล้ว')},
  cfgSave:async()=>{const o={};for(const [k] of CFG_LABELS){const v=parseFloat($('#cfg_'+k).value);o[k]=isFinite(v)?v:DEF_CFG[k]}o.squad=clamp(Math.round(o.squad),1,6);o.maxPerTeam=clamp(Math.round(o.maxPerTeam),1,6);o.formWeeks=clamp(Math.round(o.formWeeks),1,20);
    withAdmin(()=>save(()=>store.set('config','scoring',o),'บันทึกค่าแต้มแล้ว'))},
  cfgReset:()=>{withAdmin(()=>save(()=>store.set('config','scoring',{...DEF_CFG}),'คืนค่าเริ่มต้นแล้ว'))},
  wstep:el=>{S.wstep={w:S.weekId,k:el.dataset.k};render();window.scrollTo(0,0)},
  attF:el=>{S.attF=el.dataset.v;S.attLinger=new Set();render()},
  attPrev:el=>{const src=S.weeks[el.dataset.w];withAdmin(()=>{const w=S.weeks[S.weekId];const s2=new Set(w.attendees||[]);let n=0;for(const id of src.attendees||[])if(P(id)&&!s2.has(id)){s2.add(id);n++}
    return save(()=>store.merge('weeks',w.id,{attendees:[...s2]}),'ดึงรายชื่อ '+n+' คนจาก '+gwLabel(src))})},
  tgTeam:el=>{const k=S.weekId+':'+el.dataset.t;const c=S.closedTeams||(S.closedTeams=new Set());c.has(k)?c.delete(k):c.add(k);render()},
  pSheet:el=>openSheet({k:'player',pid:el.dataset.pid}),
  mSheet:el=>openSheet({k:'match',mid:el.dataset.m}),
  manage:()=>{S.nm=null;openSheet({k:'manage'})},
  sheetClose:()=>closeSheet(),
  psMove:async el=>{const w=S.weeks[S.weekId],pid=el.dataset.pid,to=+el.dataset.t,teams=clone(w.teams);teams.forEach(t=>t.players=(t.players||[]).filter(x=>x!==pid));if(to>=0)teams[to].players.push(pid);
    closeSheet();await save(()=>store.merge('weeks',w.id,{teams}),to>=0?nm(pid)+' → '+teams[to].name:'เอา '+nm(pid)+' ออกจากทีมแล้ว')},
  psPos:async el=>{const w=S.weeks[S.weekId],id=el.dataset.pid;if(posLocked(w)||w.closed){toast('GW นี้ล็อกแล้ว เปลี่ยนตำแหน่งไม่ได้',true);return}
    const nxt=posAt(w,id)==='ATT'?'DEF':'ATT';await save(()=>store.merge('weeks',w.id,{pos:{[id]:nxt}}),nm(id)+' เป็นตัว'+POS_TH[nxt]+'ใน GW นี้')},
  seedDemo:()=>seedDemo(),
  clearDemo:async()=>{await save(async()=>{for(const k of ['picks','matches','weeks','players'])for(const x of Object.values(S[k]))if(x.demo)await store.del(k,x.id)},'ลบข้อมูลตัวอย่างแล้ว');if(S.me&&!P(S.me)){S.me=null;lsSet('f7_me',null)}render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='scrim'){if(e.target===el)closeModal();return}
  if(a==='sheetScrim'){if(e.target===el)closeSheet();return}
  const h=MH[a]||ACT[a];if(h){e.preventDefault();h(el,e)}});
document.addEventListener('input',e=>{if(e.target.id==='pfQ'&&S.pf){S.pf.q=e.target.value;const l=$('#plist');if(l)l.innerHTML=playersListHTML()}
  if(e.target.id==='attQ'){S.attQ=e.target.value;const l=$('#attList'),w=S.weeks[S.weekId];if(l&&w)l.innerHTML=attRows(w)}});
document.addEventListener('change',async e=>{const el=e.target.closest('[data-change]');if(!el)return;const k=el.dataset.change;
  if(k==='me'&&el.value==='__new'){el.value=S.me||'';openPlayerForm(null,id=>becomeMe(id,true));return}
  if(k==='me'){const v=el.value;el.value=S.me||'';if(!v){forgetMe();return}becomeMe(v);return}
  if(k==='gk'&&R){R.gk[el.dataset.s]=el.value;return}
  if(k==='liveGk'){await save(()=>store.merge('matches',el.dataset.m,{gk:{[el.dataset.s]:el.value}}),'เปลี่ยนโกลแล้ว');return}
  if(k==='pfSort'){S.pf.sort=el.value;render();return}
  if(k==='pfWho'){S.pf.who=el.checked?'last':'all';render();return}
  if(k==='standWeek'){S.standWeek=el.value;render();return}
  if(k==='weekSel'){S.weekId=el.value;S.sheet=null;S.attQ='';render();return}
  if(k==='teamWeekSel'){S.teamWeekId=el.value;render();return}
  if(k==='move'){if(el.value==='')return;const w=S.weeks[S.weekId],teams=clone(w.teams),pid=el.dataset.pid,from=+el.dataset.from,to=+el.value;
    if(from>=0)teams[from].players=teams[from].players.filter(x=>x!==pid);if(to>=0)teams[to].players.push(pid);
    await save(()=>store.merge('weeks',w.id,{teams}))}
});

/* ---------- demo data ---------- */
async function seedDemo(){
  const A=['บอส','ต้น','เจ','โอ๊ต','นัท','ปอนด์','กัส'],D=['เบียร์','ตูน','แบงค์','ปิง','เอ็ม','ฟลุ๊ค','หนึ่ง'];
  const ids=[],posMap={},nameMap={};
  toast('กำลังใส่ข้อมูลตัวอย่าง…');
  const ok=await save(async()=>{
    for(const [arr,pos] of [[A,'ATT'],[D,'DEF']])for(const n of arr){const id=rid('p_');ids.push(id);posMap[id]=pos;nameMap[id]=n;await store.set('players',id,{name:n,nick:n,pos,managerOnly:false,demo:true,createdAt:Date.now()})}
    await new Promise(r=>setTimeout(r,400));
    const dates=[todayISO(-14),todayISO(-7),todayISO()];
    for(let wi=0;wi<3;wi++){const d=dates[wi];if(S.weeks[d]&&!S.weeks[d].demo)continue;
      const att=ids.filter((_,i)=>(i+wi)%9!==0);const n=wi===1?3:2;
      const teams=buildTeams(att,n,d,posMap);if(wi===0)teams[1].loans=['โกลยืม'];
      await store.set('weeks',d,{date:d,attendees:att,teams,locked:false,demo:true});
      let o=0;for(const [a,b] of roundRobin(n)){const played=wi<2;const events=[];
        if(played)for(const side of ['a','b']){const t=teams[side==='a'?a:b].players,g=Math.floor(Math.random()*4);
          for(let k=0;k<g;k++){const atk=t.filter(x=>A.includes(nameById(x))),pool=Math.random()<.75&&atk.length?atk:t;const sc=pool[Math.floor(Math.random()*pool.length)];
            const mates=t.filter(x=>x!==sc);events.push({type:'goal',side,scorer:sc,assist:Math.random()<.6?mates[Math.floor(Math.random()*mates.length)]:null})}}
        await store.set('matches',rid('m_'),{weekId:d,a,b,order:o++,played,events,votes:{},by:played?ids[0]:null,at:Date.now(),demo:true});}
      await new Promise(r=>setTimeout(r,250));
      if(wi<2)for(const mgr of [ids[0],ids[7],ids[3],ids[10]]){const pool=att.filter(x=>x!==mgr).sort(()=>Math.random()-.5);let pk=[],cost=0;
        for(const x of pool){const pr=priceInfo(x,d).price;if(pk.length<S.config.squad&&cost+pr<=S.config.budget){pk.push(x);cost+=pr}}
        await store.set('picks',d+'_'+mgr,{weekId:d,manager:mgr,players:pk,captain:pk[0],cost,at:Date.now(),demo:true})}
    }
  });
  function nameById(id){return nameMap[id]}
  if(ok){toast('ใส่ข้อมูลตัวอย่างแล้ว');S.weekId=null;S.teamWeekId=null;render()}
}

/* ---------- boot ---------- */
render();
refresh(true);
setInterval(()=>{if(document.visibilityState==='visible')refresh()},4000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});
</script>
